<title>The Great Lottery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Libre+Franklin:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  color-scheme: dark;
  --felt:#1f3b35; --felt-deep:#162c27; --felt-line:#2f544a; --felt-hi:#28493f;
  --paper:#eee6d3; --paper-edge:#d6c9a9; --ink:#2b2520; --ink-soft:#6b5f52;
  --text:#ece6d6; --text-dim:#a8b8ae;
  --wheat:#dca845; --wheat-soft:#dca84533; --madder:#c2553b; --indigo:#7fa3cf; --sage:#8fc29a;
  --up:#8fd19e; --down:#f08c70; --up-bg:#8fd19e1f; --down-bg:#f08c701f;
  --display:"IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --serif:"IM Fell English", "Iowan Old Style", Georgia, serif;
  --ui:"Libre Franklin", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; color:var(--text); font-family:var(--ui); font-size:15px; line-height:1.5;
  background:var(--felt);
  background-image:radial-gradient(ellipse at 50% -10%, #2c5247 0%, transparent 60%),
                   radial-gradient(ellipse at 50% 120%, #10231f 0%, transparent 55%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--wheat);outline-offset:2px}
table{color:inherit;font-size:inherit}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-dim);font-weight:600}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
b.up,.up-t{color:var(--up)} b.down,.down-t{color:var(--down)} b.neutral{color:inherit}
.btn{border:1px solid var(--wheat);background:var(--wheat);color:#241c10;font-weight:700;border-radius:999px;padding:10px 22px;font-size:14px;transition:transform .15s, filter .15s}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent;color:var(--wheat)}
.btn.small{padding:6px 14px;font-size:13px}
.link{background:none;border:0;color:var(--wheat);text-decoration:underline;text-underline-offset:3px;padding:0}
input[type=text]{background:var(--felt-deep);border:1px solid var(--felt-line);color:var(--text);border-radius:8px;padding:9px 12px;font:inherit;width:100%}

/* paper surfaces flip the semantic colours to dark-on-light */
.card,.sheet,.quiz,#pop{--up:#2d7a3e;--down:#b0392a;--up-bg:#2d7a3e1c;--down-bg:#b0392a18}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.wordmark{font-family:var(--display);font-size:22px;color:var(--wheat);background:none;border:0;padding:0}
.topbar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--felt-line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--text-dim);background:var(--felt-deep)}
.chip b{color:var(--text);font-weight:600}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--felt-line);border-radius:999px;padding:5px 12px 5px 6px;background:var(--felt-deep);font-size:12.5px;color:var(--text)}
.toggle .sw{width:30px;height:18px;border-radius:9px;background:var(--felt-line);position:relative;transition:background .2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:var(--text-dim);transition:transform .2s, background .2s}
.toggle[aria-pressed="true"] .sw{background:var(--wheat)}
.toggle[aria-pressed="true"] .sw::after{transform:translateX(12px);background:#241c10}

/* ---------- hint bulbs ---------- */
.bulb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:1px solid var(--wheat);background:var(--wheat-soft);color:var(--wheat);padding:0;vertical-align:middle;margin-left:6px;flex:none;transition:transform .15s}
.bulb:hover{transform:scale(1.12)}
.bulb svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet .bulb,.quiz .bulb{border-color:#8a5a14;color:#8a5a14;background:#dca84540}
#pop{position:fixed;z-index:60;max-width:300px;background:var(--paper);color:var(--ink);border-radius:10px;padding:12px 14px;box-shadow:0 14px 30px #000a;font-size:13.5px;line-height:1.45;border:1px solid var(--paper-edge);animation:rise .18s ease}
#pop h4{margin:0 0 4px;font-family:var(--display);font-size:17px;font-weight:400}
#pop .x{position:absolute;top:6px;right:8px;background:none;border:0;color:var(--ink-soft);font-size:16px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding-block:30px 10px}
.hero h1{font-size:clamp(44px,7vw,84px);line-height:.95;color:var(--paper)}
.hero h1 em{font-family:var(--serif);font-style:italic;color:var(--wheat);display:block;font-size:.5em;margin-top:10px}
.hero p.lede{font-size:17px;max-width:56ch;color:var(--text)}
.hero .quote{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--text-dim);border-left:2px solid var(--wheat);padding-left:14px;max-width:48ch}
.hero .quote span{display:block;font-family:var(--ui);font-style:normal;font-size:12px;margin-top:4px;letter-spacing:.06em}
.fan{position:relative;height:330px}
.fan .card{position:absolute;left:50%;top:10px;transform-origin:50% 120%;pointer-events:none}
.learn{margin-top:28px;background:var(--paper);color:var(--ink);border-radius:14px;padding:22px 24px;display:grid;grid-template-columns:220px 1fr;gap:24px}
.learn h2{font-size:28px;line-height:1.05}
.learn h2 small{display:block;font-family:var(--ui);font-size:13px;color:var(--ink-soft);margin-top:8px;line-height:1.45}
.learn ol{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 22px;counter-reset:l}
.learn li{counter-increment:l;display:grid;grid-template-columns:28px 1fr;gap:4px;font-size:14px}
.learn li::before{content:counter(l);font-family:var(--display);font-size:22px;color:#8a5a14;line-height:1}
.learn li b{display:block;font-size:14.5px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-top:22px}
.mode{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.mode h3{font-size:24px;color:var(--paper)}
.mode p{margin:0;color:var(--text-dim)}
.mode .btn{align-self:flex-start;margin-top:auto}

/* ---------- home v2: the game first ---------- */
.hero2{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:center;padding-block:34px 18px;min-height:min(560px,calc(100vh - 110px))}
.hero2 h1{font-size:clamp(46px,7.2vw,88px);line-height:.93;color:var(--paper)}
.hero2 h1 em{font-family:var(--serif);font-style:italic;color:var(--wheat);display:block;font-size:.46em;margin-top:12px}
.hero2 .lede{font-size:17.5px;max-width:52ch;margin:0 0 22px}
.namequote{margin:20px 0 18px;padding:2px 0 2px 16px;border-left:3px solid var(--wheat);max-width:50ch}
.namequote p{margin:0;font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;color:var(--paper)}
.namequote footer{margin-top:6px;font-size:12px;color:var(--text-dim);letter-spacing:.02em}
.play{display:flex;gap:12px;flex-wrap:wrap}
.bigplay{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border-radius:14px;padding:15px 24px 14px;border:1.5px solid var(--wheat);background:transparent;color:var(--wheat);text-align:left;transition:transform .15s, filter .15s, box-shadow .15s;min-width:220px}
.bigplay .t{font-family:var(--display);font-size:24px;line-height:1.1}
.bigplay .s{font-size:12.5px;opacity:.85;font-weight:500}
.bigplay.primary{background:var(--wheat);color:#241c10;box-shadow:0 10px 26px #dca84540}
.bigplay:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.07)}
.bigplay:disabled{opacity:.45;cursor:not-allowed}
.resume{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:999px;padding:8px 16px;font-size:13.5px;color:var(--text);max-width:100%;text-align:left}
.resume:hover{border-color:var(--wheat)}
.resume .dot{width:8px;height:8px;border-radius:50%;background:var(--up);box-shadow:0 0 0 4px #8fd19e33;flex:none}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:22px;font-size:13px;color:var(--text-dim)}
.facts b{font-family:var(--mono);color:var(--paper);font-weight:500;font-size:15px;margin-right:3px}
.fan.table{height:400px}
.fan.table::before{content:"";position:absolute;left:50%;top:58%;width:min(520px,100%);height:220px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,#dca84522,transparent 70%)}
.fan.table > .card,.fan.table > .fanwrap{position:absolute;left:50%;top:20px;transform-origin:50% 130%;transition:transform .35s cubic-bezier(.2,.8,.3,1)}
.fan.table > .fanwrap > .card{--w:158px;position:relative;left:auto;top:auto;transform:none}
.fan.table:hover > .card,.fan.table:hover > .fanwrap{transform:translateX(calc(-50% + (var(--i) - 1.5) * 34px)) rotate(calc(var(--a) * 1.35)) translateY(calc(var(--y) - 10px))!important}
.season-strip{border-top:1px solid var(--felt-line);border-bottom:1px solid var(--felt-line);padding-block:20px;margin-top:10px}
.season-strip ol{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;counter-reset:st}
.season-strip li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:2px 10px;position:relative}
.season-strip li::before{content:counter(st);grid-row:span 2;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--wheat);color:var(--wheat);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:17px}
.season-strip b{color:var(--paper);font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2}
.season-strip span{font-size:13px;color:var(--text-dim);line-height:1.45}
.study{margin-top:34px}
.study-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.study-head h2{font-size:26px;color:var(--paper)}
.study-head p{margin:0;color:var(--text-dim);font-size:14px}
.study-grid{display:grid;grid-template-columns:1.2fr repeat(3,minmax(0,1fr));gap:14px;margin-top:14px}
.tile{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:14px;padding:16px 18px;text-align:left;color:var(--text)}
.tile h3{font-size:20px;color:var(--paper)}
.tile p{margin:4px 0 0;font-size:13px;color:var(--text-dim)}
.learn-tile ul{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--text-dim);line-height:1.6}
.link-tile{display:flex;flex-direction:column;align-items:flex-start;transition:border-color .15s, transform .15s}
.link-tile:hover{border-color:var(--wheat);transform:translateY(-2px)}
.link-tile .ti svg{width:30px;height:30px;stroke:var(--wheat);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.link-tile .go{margin-top:auto;padding-top:10px;color:var(--wheat);font-weight:700;font-size:13px}
.quote.small{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--text-dim);border-left:2px solid var(--wheat);padding-left:14px;margin-top:26px;max-width:60ch}
.quote.small span{display:block;font-family:var(--ui);font-style:normal;font-size:11.5px;letter-spacing:.06em;margin-top:4px}
@media (max-width:980px){
  .hero2{grid-template-columns:1fr;min-height:0;padding-top:18px}
  .fan.table{height:320px}
  .season-strip ol{grid-template-columns:1fr 1fr}
  .study-grid{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){
  .fan.table{height:260px}
  .fan.table > .card,.fan.table > .fanwrap > .card{--w:128px;min-height:0}
  .fan.table .qt{display:none}
  .season-strip ol,.study-grid{grid-template-columns:1fr}
  .bigplay{min-width:0;flex:1 1 100%}
}

/* ---------- cards ---------- */
.card{
  --w:158px; width:var(--w); min-height:236px; background:var(--paper);
  background-image:linear-gradient(160deg,#f6f0e0 0%,var(--paper) 45%,#e4d9bf 100%);
  color:var(--ink); border-radius:11px; border:1px solid var(--paper-edge);
  box-shadow:0 1px 0 #fff8 inset, 0 8px 18px #0006, 0 2px 4px #0005;
  padding:10px 11px; display:flex; flex-direction:column; gap:6px; text-align:left;
  transition:transform .18s ease, box-shadow .18s ease, outline-color .18s; position:relative;
  outline:3px solid transparent; outline-offset:2px;
}
button.card:hover{transform:translateY(-6px)}
.card.sel{transform:translateY(-12px);outline-color:var(--wheat);box-shadow:0 18px 28px #0008}
.card.dim{opacity:.5}
.card .kind{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);font-weight:700;display:flex;justify-content:space-between}
.card .ttl{font-family:var(--display);font-size:18px;line-height:1.05;min-height:38px}
.card .ico{height:52px;display:flex;align-items:center;justify-content:center;border-radius:8px;background:#2b25200d;border:1px solid #2b252014}
.card .ico svg{width:42px;height:42px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.card .fx{font-size:12px;line-height:1.38;font-weight:500}
.card .fx b{font-weight:700}
.card .qt{font-family:var(--serif);font-style:italic;font-size:11.5px;line-height:1.3;color:var(--ink-soft);margin-top:auto;border-top:1px solid #2b25201f;padding-top:6px}
.card.locked{filter:grayscale(1);opacity:.45;cursor:not-allowed;box-shadow:0 2px 6px #0004}
button.card.locked:hover{transform:none}
.card .lockmsg{position:absolute;left:8px;right:8px;top:44%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;text-align:center;border-radius:6px;padding:5px 6px;letter-spacing:.02em}
.chips{display:flex;flex-direction:column;gap:4px}
.cx{font-size:11px;font-weight:600;line-height:1.25;padding:3px 7px;border-radius:6px;display:grid;grid-template-columns:10px 1fr;gap:4px;align-items:start}
.cx::before{font-size:9px;line-height:14px}
.cx.up{background:var(--up-bg);color:var(--up)} .cx.up::before{content:"▲"}
.cx.down{background:var(--down-bg);color:var(--down)} .cx.down::before{content:"▼"}
.cx.neutral{background:#2b25200f;color:var(--ink-soft)} .cx.neutral::before{content:"●"}
.card .pv{margin-top:auto;border-top:1px dashed #2b252040;padding-top:6px;font-size:11px;color:var(--ink-soft)}
.card .pv b{font-family:var(--mono);font-size:13px;color:var(--ink);font-weight:500}
.card.family .kind span:last-child{color:#8a5a14}
.card.action .kind span:last-child{color:#2f5a86}
.card.event{--w:200px;min-height:0;background-image:linear-gradient(160deg,#f3ead6,#e2d4b4)}
.card.event .ttl{font-size:22px;min-height:0}
.card.event .fx{font-size:12.5px;font-weight:500;line-height:1.35}
.card.event .qt{font-family:var(--serif);font-style:italic;font-size:12px;color:var(--ink-soft)}
.card.back{min-height:0;aspect-ratio:5/7;background:repeating-linear-gradient(45deg,#8e2f22 0 6px,#a23a2a 6px 12px);border-color:#5b1d15}
.card.back::after{content:"";position:absolute;inset:8px;border:1px solid #f0d9b588;border-radius:7px}

/* ---------- game layout ---------- */
.board{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px}
.panel{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:14px;padding:18px}
.panel h2{font-size:22px;color:var(--paper)}
.panel .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.yearline{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.year{font-family:var(--display);font-size:56px;line-height:1;color:var(--paper)}
.pips{display:flex;gap:4px;flex-wrap:wrap;max-width:320px}
.pip{width:20px;height:6px;border-radius:3px;background:var(--felt-line)}
.pip.done{background:var(--wheat)}
.pip.now{background:var(--paper)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-block:14px}
.stat{border-top:2px solid var(--felt-line);padding-top:8px}
.stat .v{font-family:var(--mono);font-size:26px;color:var(--paper);line-height:1.1}
.stat .s{font-size:12px;color:var(--text-dim);display:flex;align-items:center}
.stat.pop{border-color:var(--madder)} .stat.food{border-color:var(--wheat)} .stat.wage{border-color:var(--indigo)}
.stat .tag{font-size:11px;font-weight:600;letter-spacing:.04em}
.tag.bad{color:var(--down)} .tag.good{color:var(--up)} .tag.meh{color:var(--wheat)}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--text-dim);font-family:var(--ui);font-size:10px}
.legend{display:flex;gap:12px;font-size:11px;color:var(--text-dim);flex-wrap:wrap;margin-top:4px}
.legend i{display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.lbl{display:flex;align-items:center;gap:0}
.event-now{display:flex;gap:16px;align-items:flex-start;margin-top:16px;padding-top:14px;border-top:1px dashed var(--felt-line)}
.event-now .card{--w:150px;flex:none}
.event-now .card .ttl{font-size:17px}
.event-now p{margin:0 0 6px;color:var(--text-dim);font-size:14px}

.houses{display:flex;flex-direction:column;gap:10px}
.house{border:1px solid var(--felt-line);border-radius:12px;padding:12px 14px;background:var(--felt)}
.house.me{border-color:var(--wheat)}
.house .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.house .nm{font-family:var(--display);font-size:19px;color:var(--paper)}
.house .st{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.st.ready{color:var(--up)} .st.wait{color:var(--text-dim)}
.people{display:flex;flex-wrap:wrap;gap:3px;margin-block:8px;min-height:12px}
.person{width:9px;height:12px;border-radius:5px 5px 2px 2px;background:var(--paper)}
.person.lost{background:transparent;border:1px dashed var(--madder)}
.person.gone{background:var(--indigo)}
.person.new{background:var(--up)}
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-size:11px;color:var(--text-dim)}
.ledger b{display:block;font-family:var(--mono);font-size:15px;color:var(--text);font-weight:500}
.parson{font-size:11px;color:var(--text-dim);margin-top:6px;font-style:italic;font-family:var(--serif)}
.key{margin:10px 2px 0;font-size:12.5px;line-height:1.7;color:var(--text-dim)}
.key span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.key i.person{display:inline-block;flex:none;vertical-align:middle}
.parish-npc{font-size:13px;color:var(--text-dim);border-top:1px dashed var(--felt-line);padding-top:10px;display:flex;align-items:center;flex-wrap:wrap}

.hand{margin-top:22px}
.hand .rowlabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.hand h2{font-size:24px;color:var(--paper)}
.cards{display:flex;gap:14px;flex-wrap:wrap;padding-block:14px 6px}
.handgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start}
.quiz{background:var(--paper);color:var(--ink);border-radius:12px;padding:16px 18px;max-width:560px;margin-top:14px}
.quiz .eyebrow{color:var(--ink-soft)}
.quiz .q{font-family:var(--serif);font-size:18px;line-height:1.3;margin:4px 0 10px}
.quiz .opts{display:flex;flex-direction:column;gap:6px}
.quiz .opt{border:1px solid #2b252033;background:#fff6;border-radius:8px;padding:7px 10px;text-align:left;font-size:13.5px;color:var(--ink)}
.quiz .opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.lockbar{position:sticky;bottom:0;margin-top:20px;background:linear-gradient(transparent,var(--felt-deep) 35%);padding-block:22px calc(14px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lockbar .sum{font-size:14px;color:var(--text-dim)}
.lockbar .sum b{color:var(--text)}
.waiting{padding:28px;text-align:center;border:1px dashed var(--felt-line);border-radius:14px;color:var(--text-dim)}
.waiting h3{color:var(--paper);font-size:24px;margin-bottom:6px}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;background:#0b1512d9;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 40px}
.sheet{background:var(--paper);color:var(--ink);border-radius:14px;max-width:860px;width:100%;padding:26px;box-shadow:0 30px 60px #000a;animation:rise .35s ease}
@keyframes rise{from{transform:translateY(16px);opacity:.3}to{transform:none;opacity:1}}
.sheet h2{font-size:34px;line-height:1}
.sheet h3{font-size:20px}
.sheet .eyebrow{color:var(--ink-soft)}
.sheet .toprow{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.sheet .toprow .card{flex:none}
.sheet .col{flex:1;min-width:240px}
.sheet table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;color:var(--ink)}
.sheet th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:left;color:var(--ink-soft);border-bottom:1px solid #2b252040;padding:6px 6px}
.sheet td{border-bottom:1px solid #2b25201a;padding:8px 6px;vertical-align:top;color:var(--ink)}
.sheet td.n{font-family:var(--mono);text-align:right;white-space:nowrap;font-size:15px}
.sheet td .ln{font-size:12.5px;line-height:1.45}
.sheet .tblwrap{overflow-x:auto}
.sec-h{display:flex;align-items:center;margin-top:18px}
.voices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px}
.voice{border-radius:10px;padding:12px 14px;font-size:13.5px}
.voice.m{background:#dca84526;border:1px solid #dca84566}
.voice.h{background:#7fa3cf26;border:1px solid #7fa3cf66}
.voice .who{font-family:var(--display);font-size:16px;margin-bottom:4px}
.voice .say{font-family:var(--serif);font-size:15px;line-height:1.35}
.insight{margin-top:14px;padding:12px 14px;border-left:3px solid var(--ink);background:#ffffff55;font-size:14px}
.exam{margin-top:10px;border:1px solid #2b252030;border-radius:10px;overflow:hidden}
.exam .row{display:grid;grid-template-columns:130px 1fr;border-bottom:1px solid #2b25201a}
.exam .row:last-child{border-bottom:0}
.exam .row > div{padding:9px 12px;font-size:14px}
.exam .row > div:first-child{background:#ffffff66;font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--ink-soft)}
.exam .q{font-family:var(--serif);font-size:17px}
.sheet .actions{display:flex;justify-content:flex-end;margin-top:18px;gap:10px;flex-wrap:wrap}
.sheet .btn{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.sheet .btn.ghost{background:transparent;color:var(--ink)}
.bigw{font-family:var(--mono);font-size:44px;line-height:1}
.bigw small{font-size:14px;color:var(--ink-soft)}
.curtain{text-align:center;padding-block:40px}
.curtain .card.back{--w:120px;margin:0 auto 18px}
.guide h3{font-size:22px;margin-top:18px}
.guide p,.guide li{font-size:14.5px;line-height:1.55}
.guide .map{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid #2b252030;border-radius:10px;overflow:hidden;margin-top:8px}
.guide .map div{padding:8px 12px;border-bottom:1px solid #2b25201f;font-size:13.5px}
.guide .map div:nth-child(odd){background:#ffffff66;font-weight:600}

/* tutorial */
.tut .steps{display:flex;gap:6px;margin-bottom:14px}
.tut .steps span{height:5px;flex:1;border-radius:3px;background:#2b252022}
.tut .steps span.on{background:var(--ink)}
.tut .body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:26px;align-items:center;min-height:300px}
.tut .vis{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;background:#2b25200a;border-radius:12px;padding:18px;min-height:260px}
.tut .vis .card{--w:150px}
.tut p{font-size:15px;line-height:1.55;margin:8px 0}
.tut ul{padding-left:18px;margin:8px 0;font-size:14.5px}
.tut .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.tut .foot .r{display:flex;gap:8px}
.formula{font-family:var(--mono);font-size:22px;text-align:center;line-height:1.3}
.formula small{display:block;font-family:var(--ui);font-size:12px;color:var(--ink-soft)}
.gauge{width:100%;max-width:280px;height:16px;border-radius:8px;background:linear-gradient(90deg,#b0392a55,#b0392a22 45%,#2d7a3e22 55%,#2d7a3e55);position:relative;margin-top:14px}
.gauge::after{content:"subsistence";position:absolute;left:50%;top:-4px;height:24px;border-left:2px dashed var(--ink);font-size:10px;padding-left:4px;padding-top:22px;color:var(--ink-soft)}
.gauge i{position:absolute;top:-3px;width:6px;height:22px;background:var(--ink);border-radius:3px}
.mini-people{display:flex;flex-wrap:wrap;gap:4px;max-width:220px;justify-content:center}
.mini-people span{width:14px;height:19px;border-radius:7px 7px 3px 3px;background:var(--ink)}
.mini-people span.gone{background:#7fa3cf}
.mini-people span.lost{background:transparent;border:1.5px dashed #b0392a}

/* setup + lobby */
.lobby{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.roomlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.roomrow{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--felt-line);border-radius:10px;padding:10px 14px;background:var(--felt)}
.roomrow .code{font-family:var(--mono);font-size:18px;color:var(--wheat)}
.namefield{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.namefield label{font-size:12px;color:var(--text-dim);font-weight:600}
.setup-names{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:14px}
.notice{border:1px dashed var(--felt-line);border-radius:12px;padding:14px;color:var(--text-dim);font-size:14px}
.stepper{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-block:6px 18px;padding:12px 14px;border:1px solid var(--felt-line);border-radius:12px;background:var(--felt)}
.stepper .ctl{display:flex;align-items:center;border:1px solid var(--felt-line);border-radius:999px;overflow:hidden}
.stepper .ctl button{background:var(--felt-deep);border:0;width:38px;height:36px;font-size:18px;color:var(--wheat)}
.stepper .ctl button:disabled{color:var(--felt-line);cursor:not-allowed}
.stepper .ctl output{min-width:44px;text-align:center;font-family:var(--mono);font-size:20px;color:var(--paper)}
.stepper .desc{font-size:13px;color:var(--text-dim)}
.stepper .desc b{color:var(--text)}
.final-rank{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.rankrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;border-bottom:1px solid #2b25201f;padding-block:6px}
.rankrow .pos{font-family:var(--display);font-size:24px}
.rankrow .sc{font-family:var(--mono);font-size:22px}
.rankrow .br{font-size:12px;color:var(--ink-soft)}
.rankrow.winner{background:#dca84530;border-radius:10px;padding-inline:8px}
.crown{color:#8a5a14;display:inline-block;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.finalcharts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px 22px;align-items:center;margin-top:10px}
.finalcharts p{margin:0;font-size:14.5px;line-height:1.55}
.chartbox{background:var(--felt-deep);border-radius:12px;padding:12px 14px;color:var(--text)}
.chartbox .eyebrow{color:var(--text-dim)}
.chartbox b.up{color:#8fd19e}

/* big event card on the board */
.event-now .card{--w:280px}
.event-now .card .ttl{font-size:28px}
.event-now .card .fx{font-size:15px;line-height:1.4}
.event-now .card .qt{font-size:14px;line-height:1.35}
.event-now .card .kind{font-size:10px}

/* ---------- motion ---------- */
.flip{animation:flipIn .7s cubic-bezier(.2,.7,.3,1) backwards;animation-delay:var(--d,0ms)}
.flip::before{content:"";position:absolute;inset:-1px;border-radius:11px;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(45deg,#8e2f22 0 6px,#a23a2a 6px 12px);box-shadow:inset 0 0 0 6px #8e2f22, inset 0 0 0 7px #f0d9b588;
  animation:backFade .7s both;animation-delay:var(--d,0ms)}
@keyframes flipIn{0%{transform:perspective(900px) translateY(-28px) rotateY(180deg) scale(.9);opacity:0}15%{opacity:1}100%{transform:perspective(900px) rotateY(0) scale(1)}}
@keyframes backFade{0%,49%{opacity:1}51%,100%{opacity:0}}
.pop-in{animation:popIn .45s cubic-bezier(.2,1.4,.4,1) backwards;animation-delay:var(--d,0ms)}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
.card.sel{animation:none}
.card.sel::after{content:"";position:absolute;inset:-3px;border-radius:13px;box-shadow:0 0 18px 2px #dca84599;pointer-events:none;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 6px 0 #dca84544}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.stamp{position:fixed;left:50%;top:40%;z-index:55;pointer-events:none;font-family:var(--display);font-size:54px;color:var(--wheat);border:4px solid var(--wheat);border-radius:12px;padding:4px 22px;background:#162c27e6;animation:stamp .9s ease forwards}
@keyframes stamp{0%{transform:translate(-50%,-50%) scale(2.2) rotate(-14deg);opacity:0}25%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-8deg);opacity:0}}
@media (max-width:900px){.finalcharts{grid-template-columns:1fr}.event-now{flex-direction:column}.event-now .card{--w:100%}}

/* turn screen */
.turn-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.turn-head h2{font-size:34px;color:var(--paper);line-height:1}
.turn-head .glance{font-size:13px;color:var(--text-dim);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.turn-head .glance b{font-family:var(--mono);color:var(--text);font-weight:500}
.turn-grid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:22px;align-items:start}
.turn-side{display:flex;flex-direction:column;gap:14px}
.turn-side .card.event{--w:100%}
.turn-side .quiz{margin:0;max-width:none;padding:14px 16px}
.turn-side .quiz .q{font-size:16px}
.mystats{background:var(--felt-deep);border:1px solid var(--wheat);border-radius:12px;padding:12px 14px}
.mystats .nm{font-family:var(--display);font-size:20px;color:var(--paper)}
.turn-grid{grid-template-columns:270px auto 290px;justify-content:space-between}
.turn-main .cards{padding-block:10px 4px;gap:16px;flex-wrap:nowrap}
.turn-main .card{--w:172px;min-height:262px}
.turn-main .card .ttl{font-size:19px}
.turn-main .card .fx{font-size:12.5px}
.turn-right{display:flex;flex-direction:column;gap:14px}
.turn-right .quiz{margin:0;max-width:none;padding:14px 16px}
.turn-right .quiz .q{font-size:16px}
.choices{background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:12px;padding:14px 16px}
.choices dl{margin:10px 0 14px;display:flex;flex-direction:column;gap:8px}
.choices dl div{display:grid;grid-template-columns:92px 1fr;gap:8px;font-size:13.5px;border-bottom:1px dashed var(--felt-line);padding-bottom:7px}
.choices dt{color:var(--text-dim)}
.choices dd{margin:0;color:var(--paper);font-weight:600}
.dim-t{color:var(--text-dim);font-weight:400}
.lockbtn{width:100%;padding-block:12px;font-size:15px}
@media (max-width:1180px){
  .turn-grid{grid-template-columns:260px minmax(0,1fr)}
  .turn-right{grid-column:1 / -1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .turn-main .cards{flex-wrap:wrap}
}
@media (max-width:760px){ .turn-right{grid-template-columns:1fr} }
.turn-lock{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:14px;border-top:1px dashed var(--felt-line)}
.turn-lock .sum{font-size:14px;color:var(--text-dim)}
.turn-lock .sum b{color:var(--text)}
.board-cta{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:18px 20px;border:1px solid var(--wheat);border-radius:14px;background:var(--felt-deep)}
.board-cta h3{font-size:24px;color:var(--paper)}
.board-cta p{margin:2px 0 0;color:var(--text-dim);font-size:14px}

/* study notes */
.notes{max-width:900px;margin:0 auto}
.notes .sheet{max-width:none;animation:none}
.notes h2{font-size:30px;margin-top:30px}
.notes h2:first-of-type{margin-top:6px}
.notes h3{font-size:19px;margin-top:18px}
.notes p,.notes li{font-size:15px;line-height:1.6;max-width:72ch}
.notes .callout{border-left:3px solid #8a5a14;background:#dca84522;padding:10px 14px;border-radius:0 8px 8px 0;font-size:14.5px}
.notes .big{font-family:var(--serif);font-size:21px;line-height:1.4}
.notes table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px;color:var(--ink)}
.notes th,.notes td{border-bottom:1px solid #2b252022;padding:7px 8px;text-align:left;vertical-align:top;color:var(--ink)}
.notes th{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.notes td.n{font-family:var(--mono);text-align:right}
.notes .tw{overflow-x:auto}
.notes .flow{font-family:var(--mono);font-size:13.5px;background:#2b25200d;border-radius:10px;padding:14px 16px;line-height:1.9}
.notes .flow b{font-family:var(--ui)}
.notes-wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start;max-width:1140px;margin:0 auto}
.notes-wrap .notes{max-width:none;margin:0}
.outline{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));background:var(--felt-deep);border:1px solid var(--felt-line);border-radius:14px;padding:14px 10px;max-height:calc(100vh - 32px);overflow-y:auto}
.outline .eyebrow{padding-inline:10px;margin-bottom:8px}
.outline nav{display:flex;flex-direction:column;gap:2px}
.outline button.sec{background:none;border:0;border-left:2px solid transparent;text-align:left;padding:7px 10px;border-radius:0 8px 8px 0;font-size:13.5px;color:var(--text-dim);display:grid;grid-template-columns:22px 1fr;gap:4px;line-height:1.3}
.outline button.sec span{font-family:var(--mono);font-size:11px;color:var(--wheat);padding-top:2px}
.outline button.sec:hover{background:var(--felt-hi);color:var(--text)}
.outline button.sec.on{border-left-color:var(--wheat);background:var(--felt-hi);color:var(--paper);font-weight:600}
.outline .back{margin:12px 10px 2px;width:calc(100% - 20px)}
.notes h2[id]{scroll-margin-top:20px}
.notes h2 small{font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-left:8px;white-space:nowrap}
.cat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:16px;justify-items:center;background:var(--felt);border-radius:12px;padding:18px;margin-top:12px}
.cat-grid .card{--w:100%;max-width:190px}
.cat-events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;margin-top:12px}
.cat-ev{background:var(--felt);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:10px}
.cat-ev .card.event{--w:100%}
.cat-ev .meta .eyebrow{color:var(--text-dim);margin-bottom:6px}
.cat-ev .voice{background:#7fa3cf33;color:var(--text);border-color:#7fa3cf55}
.cat-quiz{padding-left:22px;display:flex;flex-direction:column;gap:14px;margin-top:12px}
.cat-quiz > li{border-bottom:1px solid #2b25201f;padding-bottom:12px}
.cat-quiz .q{font-family:var(--serif);font-size:18px;line-height:1.3}
.cat-quiz .opts{list-style:none;padding:0;margin:6px 0;display:flex;flex-wrap:wrap;gap:6px}
.cat-quiz .opts li{font-size:13px;border:1px solid #2b252026;border-radius:8px;padding:4px 10px;background:#fff5;max-width:none}
.cat-quiz .opts li.right{border-color:#2d7a3e66;background:#2d7a3e14}
.cat-quiz .why{margin:4px 0;font-size:14px}
.cat-qsec{margin-top:22px!important;padding-bottom:4px;border-bottom:2px solid #8a5a1455}
.cat-qsec small{font-family:var(--ui);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-left:6px}

/* examination hall */
.extras{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:30px}
.extras .catalog-cta{margin-top:0;grid-template-columns:1fr;gap:18px;align-content:start}
.mini-quiz{background:var(--paper);color:var(--ink);border-radius:12px;padding:12px 14px;max-width:320px;box-shadow:0 8px 18px #0006;transform:rotate(-2deg)}
.mini-quiz .q{font-family:var(--serif);font-size:15px;margin:4px 0 8px}
.mini-quiz span{display:block;font-size:12px;border:1px solid #2b252026;border-radius:6px;padding:4px 8px;margin-top:4px}
.mini-quiz span.ok{border-color:#2d7a3e;background:#2d7a3e1a;color:#2d7a3e;font-weight:700}
.hall{max-width:860px;margin:0 auto}
.hall-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.hall-head h2{font-size:40px;color:var(--paper);line-height:1}
.hall-head .score{font-family:var(--mono);font-size:15px;color:var(--text-dim)}
.hall-head .score b{color:var(--up);font-size:22px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 12px}
.filters button{border:1px solid var(--felt-line);background:var(--felt-deep);color:var(--text-dim);border-radius:999px;padding:6px 12px;font-size:12.5px}
.filters button.on{background:var(--wheat);border-color:var(--wheat);color:#241c10;font-weight:700}
.filters button small{opacity:.75;margin-left:3px}
.progress{height:8px;border-radius:4px;background:var(--felt-line);overflow:hidden;margin-bottom:6px}
.progress i{display:block;height:100%;background:var(--wheat);transition:width .35s ease}
.pmeta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text-dim);margin-bottom:12px}
.pcard{background:var(--paper);color:var(--ink);border-radius:16px;padding:26px 28px;box-shadow:0 20px 40px #0007}
.pcard .qtext{font-family:var(--serif);font-size:26px;line-height:1.25;margin:8px 0 18px;text-wrap:balance}
.pcard .eyebrow{color:var(--ink-soft)}
.popts{display:flex;flex-direction:column;gap:10px}
.popt{display:grid;grid-template-columns:34px 1fr 24px;gap:10px;align-items:center;text-align:left;border:1.5px solid #2b252030;background:#fff7;border-radius:12px;padding:12px 14px;font-size:15.5px;color:var(--ink);transition:transform .12s, border-color .15s, background .15s}
.popt:hover:not(:disabled){transform:translateX(4px);border-color:var(--ink)}
.popt .ltr{width:30px;height:30px;border-radius:50%;border:1.5px solid #2b252055;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:16px}
.popt:disabled{cursor:default}
.popt.right{border-color:#2d7a3e;background:#2d7a3e1f}
.popt.right .ltr{background:#2d7a3e;color:#fff;border-color:#2d7a3e}
.popt.wrong{border-color:#b0392a;background:#b0392a14}
.popt.wrong .ltr{background:#b0392a;color:#fff;border-color:#b0392a}
.popt.faded{opacity:.5}
.popt .mk{font-weight:700;font-size:18px}
.pexplain{margin-top:18px;border-radius:12px;padding:14px 16px;animation:rise .3s ease}
.pexplain.ok{background:#2d7a3e14;border:1px solid #2d7a3e44}
.pexplain.no{background:#b0392a10;border:1px solid #b0392a40}
.pexplain h4{margin:0 0 6px;font-family:var(--display);font-size:22px;font-weight:400}
.pexplain p{margin:6px 0 0;font-size:14.5px;line-height:1.55}
.pfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.pfoot .kbd{font-size:12px;color:var(--ink-soft)}
.pfoot .btn{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.presult .big{font-family:var(--mono);font-size:64px;line-height:1}
.presult .bars{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.presult .bar{display:grid;grid-template-columns:170px 1fr 54px;gap:10px;align-items:center;font-size:13px}
.presult .bar .t{height:10px;border-radius:5px;background:#2b252018;overflow:hidden}
.presult .bar .t i{display:block;height:100%;background:#2d7a3e}
.presult .missed{margin-top:18px;padding-left:20px}
.presult .missed li{margin-bottom:10px;font-size:14px}
@media (max-width:760px){.extras{grid-template-columns:1fr}.pcard{padding:18px}.pcard .qtext{font-size:21px}.presult .bar{grid-template-columns:110px 1fr 44px}}
.catalog-cta{margin-top:30px;display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:24px 28px;border:1px solid var(--felt-line);border-radius:16px;background:var(--felt-deep)}
.catalog-cta h3{font-size:30px;color:var(--paper);margin:4px 0 6px}
.catalog-cta p{color:var(--text-dim);margin:0 0 14px;max-width:60ch}
.mini-fan{display:flex;padding-inline:10px}
.mini-fan > div{margin-left:-46px}
.mini-fan > div:first-child{margin-left:0}
.mini-fan .card{--w:132px;min-height:0;pointer-events:none}
.mini-fan .card .qt,.mini-fan .card .fx{display:none}
@media (max-width:760px){.catalog-cta{grid-template-columns:1fr}.mini-fan{justify-content:center}}
@media (max-width:900px){
  .notes-wrap{grid-template-columns:1fr}
  .outline{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;max-height:none;padding:8px;border-radius:12px}
  .outline .eyebrow,.outline .back{display:none}
  .outline nav{flex-direction:row;overflow-x:auto;gap:4px}
  .outline button.sec{flex:none;border-left:0;border-bottom:2px solid transparent;border-radius:8px;white-space:nowrap}
  .outline button.sec.on{border-bottom-color:var(--wheat)}
  .notes h2[id]{scroll-margin-top:72px}
}

@media (max-width:1000px){ .turn-grid{grid-template-columns:1fr} .turn-side{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))} }
@media (max-width:900px){
  .board,.lobby,.hero,.learn,.tut .body{grid-template-columns:1fr}
  .fan{height:260px}
  .handgrid{grid-template-columns:1fr}
}
@media (max-width:560px){
  .card{--w:142px;min-height:220px}
  .stats{grid-template-columns:1fr 1fr 1fr;gap:8px}
  .stat .v{font-size:20px}
  .charts,.voices,.setup-names{grid-template-columns:1fr}
  .year{font-size:44px}
  .sheet{padding:18px}
  .exam .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.flip::before,.confetti,.stamp{display:none!important}}

function affordable(k, p){
  if(!p) return true;
  if(k==='improve') return p.savings>=3;
  if(k==='emigrate') return p.savings>=2 && p.family>2;
  if(k==='allotment') return p.savings>=1;
  return true;
}

const PARSON = v => v >= 6 ? 'The parson calls them “deserving poor.”' : v >= 2 ? 'The parson nods approvingly.' : v > -2 ? 'The parson reserves judgement.' : v > -6 ? 'The parson frowns at their improvidence.' : 'The parson preaches against them by name.';

/* =========================================================
   ENGINE: pure and seeded, identical for local and online play
   ========================================================= */
function hash(s){let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return (h>>>0)}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,rng){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const FAM_WEIGHT = {early:3, late:3, boom:2, control:2, tavern:2, fruitful:2, service:2, thrift:2, feast:2, love:2, celibate:2, parish:2, elder:2, loom:2, lodgers:2};
function drawN(weights, n, rng){
  const out = [], w = {...weights};
  for(let j=0;j<n;j++){
    const pool=[]; for(const k in w) for(let i=0;i<w[k];i++) pool.push(k);
    if(!pool.length) break;
    const k = pool[Math.floor(rng()*pool.length)]; out.push(k); delete w[k];
  }
  return out;
}
const ACT_WEIGHT = () => Object.fromEntries(Object.keys(ACTIONS).map(k=>[k,ACTIONS[k].weight]));
function dealHands(p, rng){ p.famHand = drawN(FAM_WEIGHT, 3, rng); p.hand = drawN(ACT_WEIGHT(), 3, rng); }
const r1 = x => Math.round(x*10)/10;
const yearAt = (r, max) => max<=1 ? 1798 : 1798 + Math.round((r-1)*35/(max-1));
const yearOf = (r, s) => yearAt(r, s ? s.maxRounds : 8);
const IMPROVE_GAINS = [2, 1.5, 1, .5, .5, .5, .5, .5];
const MIN_SEASONS = 3, MAX_SEASONS = 12;

function newGame(plist, seed, rounds=8){
  rounds = Math.max(MIN_SEASONS, Math.min(MAX_SEASONS, rounds|0));
  const rng = mulberry(hash(seed+'|deal'));
  const n = plist.length, npc = 12 + 4*n, pop0 = 6*n + npc;
  const used = new Set(), events = [];
  for(let r=1;r<=rounds;r++){
    const y = yearAt(r, rounds);
    let ok = EVENTS.filter(e=>!used.has(e.id) && e.y0<=y && e.y1>=y);
    if(!ok.length) ok = EVENTS.filter(e=>e.y0<=y && e.y1>=y);
    const e = ok[Math.floor(rng()*ok.length)]; used.add(e.id); events.push(e.id);
  }
  const players = {};
  plist.forEach(p=>{players[p.id]={id:p.id,name:p.name,family:6,savings:2,comfort:0,virtue:0,deaths:0,emigrants:0}; dealHands(players[p.id], rng)});
  return {v:4, seed, round:1, maxRounds:rounds, npc, food:r1(pop0*1.3), growth:r1(pop0*.10), improvements:0,
    lastWage:1.3, poorRate:0, cornLaw:false, reliefCap:3, unionRisk:.35,
    order:plist.map(p=>p.id), players, events, quiz:shuffle(QUIZ.map((_,i)=>i),rng).slice(0,rounds),
    history:[{year:1793,pop:pop0,food:r1(pop0*1.3),wage:1.3}], report:null, over:false};
}

function score(p){return Math.round(p.family + p.emigrants + p.savings + p.comfort - 2*p.deaths)}

function resolveRound(prev, moves){
  const s = JSON.parse(JSON.stringify(prev));
  const rng = mulberry(hash(s.seed+'|round'+s.round));
  const ev = EVENTS.find(e=>e.id===s.events[s.round-1]);
  const q = QUIZ[s.quiz[s.round-1]];
  const lines = {};
  const add = (id,label,value,k='neutral')=>(lines[id]=lines[id]||[]).push({l:label,v:value,k});
  const start = {}; s.order.forEach(id=>{const p=s.players[id]; start[id]={family:p.family,legacy:score(p),deaths:p.deaths}});
  const M = {};
  for(const id of s.order){
    const m = moves[id]||{}, p = s.players[id], fh = p.famHand;
    const fam = FAMILY[m.family] && (!fh || fh.includes(m.family)) ? m.family : (!fh || fh.includes('late') ? 'late' : fh[0]);
    const act = ACTIONS[m.action] && p.hand.includes(m.action) && affordable(m.action, p) ? m.action : null;
    M[id] = {family:fam, action:act, quiz:m.quiz};
  }
  const mv = id => M[id];

  // persistent event effects
  if(ev.growth) s.growth = r1(s.growth + ev.growth);
  if(ev.cornLaw) s.cornLaw = true;
  if(ev.reliefCap) s.reliefCap = Math.max(1, s.reliefCap + ev.reliefCap);
  if(ev.unionRisk) s.unionRisk = ev.unionRisk;
  if(s.round>1) s.food = r1(s.food + s.growth);

  // 1. births respond to last season's wage
  const fert = s.lastWage >= 1 ? 1 : .5;
  let births = 0;
  for(const id of s.order){
    const p = s.players[id], m = mv(id), f = FAMILY[m.family];
    const rate = birthRate(m.family, s);
    const b = Math.round(p.family * rate * fert);
    p.family += b; births += b; p.virtue += f.virtue;
    add(id, f.title, b ? `+${b} born${fert<1?' (hunger halved births)':''}` : (m.family==='boom'?'times too hard, no births':'no births'), b?'up':'neutral');
    if(m.family==='service' && p.family>2){p.family--;p.emigrants++;add(id,'Into service','1 child left home to work','up')}
    if(m.family==='love'){p.comfort=r1(p.comfort+1);add(id,'Marry for Love','+1 comfort','up')}
    if(m.family==='celibate'){p.savings=r1(p.savings+1);add(id,'Stay Single','+1 savings','up')}
    if(m.family==='elder'){p.family++;p.comfort=r1(p.comfort+2);add(id,'Aging parent','moved in: +1 mouth','down');add(id,'Aging parent','+2 comfort','up')}
    if(m.family==='feast'){p.comfort=r1(p.comfort+2);add(id,'Wedding feast','+2 comfort','up');if(p.savings>=1){p.savings=r1(p.savings-1);add(id,'Wedding feast','−1 savings','down')}}
  }
  const npcRate = s.lastWage>=1.2?.30:s.lastWage>=1.05?.18:s.lastWage>=.95?.06:0;
  const npcBirths = Math.round(s.npc*npcRate); s.npc += npcBirths;

  // 2. pre-harvest actions
  for(const id of s.order){
    const p = s.players[id], m = mv(id);
    if(m.action==='emigrate'){
      if(p.savings>=2 && p.family>2){p.savings=r1(p.savings-2);p.family-=2;p.emigrants+=2;add(id,'Emigration','2 relatives sailed for America (−2 savings)','up')}
      else add(id,'Emigration','couldn’t afford passage (needs 2 savings)','down');
    }
    if(m.action==='improve'){
      if(p.savings>=3){const g=IMPROVE_GAINS[Math.min(s.improvements,7)];p.savings=r1(p.savings-3);s.improvements++;s.growth=r1(s.growth+g);add(id,'Improved the land',`harvest +${g} a season for all (−3 savings)`,'up')}
      else add(id,'Improve the land','couldn’t afford it (needs 3 savings)','down');
    }
    if(m.action==='petition'){
      if(!s.cornLaw) add(id,'Petition','no Corn Law to repeal yet','neutral');
      else if(rng()<.35){s.cornLaw=false;add(id,'Petition','Parliament repealed the Corn Law!','up')}
      else add(id,'Petition','Parliament ignored it','neutral');
    }
    if(m.action==='godwin'){p.comfort=r1(p.comfort+2);p.virtue-=2;add(id,'Read Godwin','+2 comfort','up')}
    if(m.action==='machines'){
      p.comfort=r1(p.comfort+2);p.virtue-=2;add(id,'Broke the machines','+2 comfort','up');
      if(rng()<s.unionRisk && p.family>1){p.family--;p.deaths++;add(id,'Frame-breaking trial','a relative was hanged or transported','down')}
    }
    if(m.action==='allotment'){p.savings=r1(p.savings-1);add(id,'Allotment rent','−1 savings','down')}
  }
  if(ev.kill){
    for(const id of s.order){const p=s.players[id];const d=Math.min(Math.floor(p.family*ev.kill),p.family-1);if(d){p.family-=d;p.deaths+=d;add(id,ev.title,`${d} died`,'down')}}
    s.npc = r1(s.npc*(1-ev.kill));
  }
  if(ev.addPeople) for(const id of s.order){s.players[id].family+=ev.addPeople;add(id,ev.title,`+${ev.addPeople} child survived`,'up')}
  if(ev.npcGrow) s.npc = r1(s.npc*(1+ev.npcGrow));
  if(ev.savingsGain) for(const id of s.order){const p=s.players[id];p.savings=r1(p.savings+ev.savingsGain);add(id,ev.title,`+${ev.savingsGain} savings`,'up')}
  if(ev.savingsLoss) for(const id of s.order){const p=s.players[id];const l=r1(p.savings*ev.savingsLoss);if(l>0){p.savings=r1(p.savings-l);add(id,ev.title,`−${l} savings`,'down')}}

  // 3. the harvest and the wage
  const pop = s.order.reduce((a,id)=>a+s.players[id].family,0) + s.npc;
  const harvest = s.food * ev.mult * (s.cornLaw ? .9 : 1);
  const avail = Math.max(0, harvest - s.poorRate);
  const wage = avail / pop;
  let reliefPaid = 0, deaths = 0;

  for(const id of s.order){
    const p = s.players[id], m = mv(id);
    let rate = wage, extra = 0;
    if(m.action==='union'){
      if(rng() < s.unionRisk){
        if(p.savings>=3){p.savings=r1(p.savings-3);add(id,'Combination Act','prosecuted, fined 3 savings','down')}
        else if(p.family>1){p.family--;p.deaths++;add(id,'Combination Act','prosecuted, a relative transported','down')}
      } else {rate *= 1.25; add(id,'Combination','held firm: wages ×1.25','up')}
    }
    if(m.action==='mill'){
      extra += p.family*.25*(ev.millBoost?2:1);
      add(id,'Mill wages',`+${r1(p.family*.25*(ev.millBoost?2:1))} loaves`,'up');
      if(rng() < .3 && p.family>1){p.family--;p.deaths++;add(id,'Mill accident','a child was lost','down')}
    }
    if(m.action==='glean'){extra += 2; add(id,'Gleaning','+2 loaves','up')}
    if(m.family==='lodgers'){extra += 1.5; add(id,'Lodgers’ rent','+1.5 loaves','up')}
    if(m.family==='loom'){const g=r1(p.family*.15);extra += g; add(id,'Loom work',`+${g} loaves`,'up')}
    if(m.action==='manchester'){
      extra += 2.5; add(id,'Work in Manchester','+2.5 loaves','up');
      if(rng()<.2 && p.family>1){p.family--;p.deaths++;add(id,'Fever in the slums','a relative died','down')}
    }
    if(m.action==='allotment'){const g=r1(p.family*.4);extra += g; add(id,'Allotment',`+${g} loaves`,'up')}
    if(m.action==='poach'){
      if(rng()<.3){
        if(p.savings>=3){p.savings=r1(p.savings-3);add(id,'Caught poaching','fined 3 savings','down')}
        else if(p.family>1){p.family--;p.deaths++;add(id,'Caught poaching','a relative was transported','down')}
      } else {extra += 3; add(id,'Poaching','+3 loaves','up')}
    }
    const income = p.family*rate + extra, need = p.family;
    const net = income - need;
    if(m.quiz === q.a){p.savings=r1(p.savings+1);add(id,'Question','correct: +1 savings','up')}
    else add(id,'Question', m.quiz==null?'not answered, no reward':'wrong answer, no reward','down');
    if(ev.comfort){p.comfort=r1(p.comfort+ev.comfort);add(id,ev.title,`${ev.comfort>0?'+':'−'}${Math.abs(ev.comfort)} comfort`,ev.comfort>0?'up':'down')}
    if(net >= 0){
      if(m.family==='tavern'){p.comfort=r1(p.comfort+net*1.5);add(id,'Ale-house',`surplus of ${r1(net)} drunk: +${r1(net*1.5)} comfort`,'up')}
      else if(net>=.05){const g=r1(net*(m.family==='thrift'?1.25:1));p.savings=r1(p.savings+g);add(id,m.family==='thrift'?'Frugal surplus':'Surplus',`+${g} savings`,'up')}
      else add(id,'Harvest','just enough to eat','neutral');
    } else {
      let short = -net;
      add(id,'Harvest',`short ${r1(short)} loaves`,'down');
      const use = Math.min(p.savings, short); p.savings = r1(p.savings-use); short -= use;
      if(use>0) add(id,'Savings',`−${r1(use)} spent to eat`,'down');
      if(short>0 && m.action==='charity'){const cov=Math.min(short,2);short-=cov;add(id,'Private charity',`covered ${r1(cov)} loaves`,'up')}
      if(short>0 && m.family==='parish'){const cov=Math.min(short,2);short-=cov;reliefPaid+=cov;add(id,'Parish support',`covered ${r1(cov)} loaves`,'up')}
      if(short>0 && m.action==='relief'){const cov=Math.min(short,s.reliefCap);short-=cov;reliefPaid+=cov;add(id,'Poor relief',`covered ${r1(cov)} loaves`,'up')}
      if(short>0 && m.action==='workhouse'){reliefPaid+=short;add(id,'Workhouse',`covered ${r1(short)} loaves`,'up');short=0;p.comfort=r1(p.comfort-2);p.virtue-=1;add(id,'Workhouse','−2 comfort','down')}
      const d = Math.min(Math.ceil(short*1.5 - 1e-9), p.family-1);
      if(d>0){p.family-=d;p.deaths+=d;deaths+=d;add(id,'Want and sickness',`${d} died`,'down')}
    }
    if(m.action==='workhouse' && net>=0) add(id,'Workhouse','not needed this season','neutral');
    if(m.action==='relief' && net>=0) add(id,'Poor relief','not needed this season','neutral');
    if(m.action==='charity' && net>=0) add(id,'Private charity','not needed this season','neutral');
    if(m.action==='friendly'){const g=r1(Math.min(3,Math.max(1,p.savings*.2)));p.savings=r1(p.savings+g);p.virtue+=1;add(id,'Friendly Society',`+${g} savings`,'up')}
  }
  for(const id of s.order) dealHands(s.players[id], rng);
  let npcDeaths = 0;
  if(wage < 1){npcDeaths = Math.round(s.npc*(1-wage)); s.npc = Math.max(4, s.npc-npcDeaths)}
  s.npc = Math.round(s.npc);
  s.poorRate = r1(reliefPaid);

  const popAfter = s.order.reduce((a,id)=>a+s.players[id].family,0) + s.npc;
  const picks = {}; s.order.forEach(id=>{const k=mv(id).family; picks[k]=(picks[k]||0)+1});
  const lost = s.order.reduce((a,id)=>a+s.players[id].deaths-start[id].deaths,0);
  s.history.push({year:yearOf(s.round,s), pop:popAfter, food:r1(avail), wage:Math.round(wage*100)/100,
    ev:ev.id, births, lost, npcB:npcBirths, npcD:npcDeaths, relief:r1(reliefPaid), picks});

  let insight;
  if(wage < .95) insight = `The real wage fell to ${wage.toFixed(2)} loaves a head, below subsistence. The positive check is at work: population is being forced back down to the food supply. This is the trough of Malthus’s wage cycle.`;
  else if(wage < 1.05) insight = `The wage sits at subsistence (${wage.toFixed(2)}). This is where Malthus says wages always return: births and food are barely balanced.`;
  else insight = `The wage is above subsistence (${wage.toFixed(2)}). Malthus predicts that comfort encourages marriages and births, so watch the parish population surge next season and pull the wage back down.`;
  if(reliefPaid>0) insight += ` Parish relief paid out ${r1(reliefPaid)} loaves, which comes off next season’s food as the poor rate: Malthus’s first objection to the Poor Laws.`;

  s.report = {round:s.round, year:yearOf(s.round,s), event:ev.id, wage:Math.round(wage*100)/100, pop, avail:r1(avail),
    births, deaths, npcBirths, npcDeaths, reliefPaid:r1(reliefPaid), lines, insight, quiz:s.quiz[s.round-1], start,
    answers:Object.fromEntries(s.order.map(id=>[id, moves[id]?.quiz ?? null])),
    chose:Object.fromEntries(s.order.map(id=>[id, {family:mv(id).family, action:mv(id).action}]))};
  s.lastWage = wage;
  s.round++;
  if(s.round > s.maxRounds) s.over = true;
  return s;
}

function chartSVG(hist, which){
  const W=320,H=170,L=34,R=10,T=12,B=24;
  const xs = i => L + (W-L-R) * (hist.length<2 ? 0 : i/(Math.max(hist.length-1,1)));
  let series, maxY, minY=0, lines='', grid='';
  if(which==='pf'){
    maxY = Math.max(...hist.map(h=>Math.max(h.pop,h.food)))*1.1;
    series = [{k:'pop',c:'var(--madder)'},{k:'food',c:'var(--wheat)'}];
  } else {
    maxY = Math.max(1.6, ...hist.map(h=>h.wage)); minY = Math.min(.5, ...hist.map(h=>h.wage));
    series = [{k:'wage',c:'var(--indigo)'}];
  }
  const ys = v => T + (H-T-B) * (1 - (v-minY)/(maxY-minY));
  const ticks = which==='pf' ? [0, Math.round(maxY/2), Math.round(maxY)] : [minY, 1, maxY].map(v=>Math.round(v*100)/100);
  for(const t of ticks){grid += `<line x1="${L}" x2="${W-R}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--felt-line)" stroke-width="1"/><text x="${L-6}" y="${ys(t)+3}" text-anchor="end">${t}</text>`}
  if(which==='w') grid += `<line x1="${L}" x2="${W-R}" y1="${ys(1)}" y2="${ys(1)}" stroke="var(--paper)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${ys(1)-5}" text-anchor="end" style="fill:var(--paper)">subsistence</text>`;
  for(const s of series){
    const pts = hist.map((h,i)=>`${xs(i).toFixed(1)},${ys(h[s.k]).toFixed(1)}`).join(' ');
    if(which==='w') lines += `<polygon points="${xs(0)},${ys(minY)} ${pts} ${xs(hist.length-1)},${ys(minY)}" fill="var(--indigo)" opacity=".12"/>`;
    lines += `<polyline points="${pts}" fill="none" stroke="${s.c}" stroke-width="2.4" stroke-linejoin="round"/>`;
    const last = hist[hist.length-1];
    lines += `<circle cx="${xs(hist.length-1)}" cy="${ys(last[s.k])}" r="4" fill="${s.c}"/>`;
  }
  const xl = hist.map((h,i)=> (i===0||i===hist.length-1||hist.length<6) ? `<text x="${xs(i)}" y="${H-6}" text-anchor="middle">${h.year}</text>` : '').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${which==='pf'?'Population versus food':'Real wage over time'}">${grid}${lines}${xl}</svg>`;
}

function renderNotes(){
  const pop=[1,2,4,8,16,32,64,128,256], food=[1,2,3,4,5,6,7,8,9];
  const secs = ['The big idea','Why he wrote it','The core model','The checks','Theory of wages','Policy conclusions','Hunt’s critique','Legacy','Cheat sheet','Test yourself'];
  $app.innerHTML = `${topbar()}
  <div class="notes-wrap">
  <aside class="outline" aria-label="Study notes outline"><div class="eyebrow">Outline</div>
    <nav>${secs.map((s,i)=>`<button class="sec${i===0?' on':''}" data-sec="n${i+1}"><span>${i+1}</span>${s}</button>`).join('')}</nav>
    <button class="btn small back" data-go="home">Back to the game</button></aside>
  <div class="notes"><div class="sheet">
    <div class="eyebrow">Study notes · Hunt &amp; Lautzenheiser, <i>History of Economic Thought</i> (2011), Ch. 4</div>
    <h2 style="font-size:40px;margin-top:8px">Malthus on Population and Wages</h2>
    <p style="color:var(--ink-soft);font-size:14px">Mostly from “The Theory of Population” (pp. 71–78), with background on wages from pp. 65–71 and Malthus’s later argument about wages from pp. 87–88.</p>
    <p class="callout"><b>Heads up:</b> Hunt is a <i>critical</i> (Marxian-leaning) historian. The book explains what Malthus said and also argues that his theory defended the wealthy. Keep <b>(a) Malthus’s theory</b> separate from <b>(b) Hunt’s critique of it</b>. Exam questions often ask for one or the other.</p>

    <h2 id="n1">1. The big idea in one sentence</h2>
    <p class="big">Population tends to grow faster than the food supply. So something (late marriage, vice, or misery) must keep holding population down, and most people’s wages get pushed back toward bare subsistence.</p>

    <h2 id="n2">2. Why Malthus wrote it</h2>
    <ul>
      <li><b>Who:</b> Thomas Robert Malthus (1766–1834). He held Britain’s first professorship of political economy, at the East India Company’s college.</li>
      <li><b>When:</b> The Industrial Revolution. Workers lived near subsistence and real wages fell in the late 1700s. There were child labor, 14–18 hour days, slums, riots, early unions and the Luddites.</li>
      <li><b>Against whom:</b> Radical reformers who blamed poverty on <i>institutions</i>, not nature. <b>Condorcet</b> wanted a welfare fund and credit for workers. <b>William Godwin</b> blamed private property and a government run by the rich.</li>
      <li><b>His book:</b> <i>An Essay on the Principle of Population</i> (1798). A heavily revised second edition followed in 1803.</li>
    </ul>
    <p>Malthus’s reply: even a perfect, equal society would soon split back into <b>proprietors and laborers</b> because of the “inevitable laws of nature.”</p>

    <h2 id="n3">3. The core model: geometric vs. arithmetic</h2>
    <div class="tw"><table><thead><tr><th></th><th>Growth pattern</th><th>Malthus’s claim</th></tr></thead><tbody>
      <tr><td><b>Population</b></td><td>Geometric (1, 2, 4, 8…)</td><td>Unchecked, it doubles about every 25 years.</td></tr>
      <tr><td><b>Food supply</b></td><td>Arithmetic (1, 2, 3, 4…)</td><td>On limited land, each generation adds at most the same fixed amount, and realistically less (diminishing returns).</td></tr>
    </tbody></table></div>
    <p style="font-size:13px;color:var(--ink-soft);margin-top:12px">Illustration (a standard classroom example, not in Hunt’s text):</p>
    <div class="tw"><table><thead><tr><th>Years</th>${pop.map((_,i)=>`<th style="text-align:right">${i*25}</th>`).join('')}</tr></thead><tbody>
      <tr><td><b>Population</b></td>${pop.map(v=>`<td class="n">${v}</td>`).join('')}</tr>
      <tr><td><b>Food</b></td>${food.map(v=>`<td class="n">${v}</td>`).join('')}</tr></tbody></table></div>
    <p>The gap grows without limit, but real populations never actually grow like this. So Malthus’s real question was: <b>what forces check population?</b></p>

    <h2 id="n4">4. The checks on population</h2>
    <h3>By what they do</h3>
    <div class="tw"><table><thead><tr><th>Type</th><th>Works through</th><th>Examples</th></tr></thead><tbody>
      <tr><td><b>Preventive</b></td><td>Fewer <b>births</b></td><td>Sterility, sexual abstinence, birth control</td></tr>
      <tr><td><b>Positive</b></td><td>More <b>deaths</b></td><td>Famine, misery, plague, war, and finally starvation</td></tr></tbody></table></div>
    <p>If preventive checks aren’t strong enough, positive checks take over. If disease and war aren’t enough, starvation does the job.</p>
    <h3>By morals: “moral restraint, vice and misery”</h3>
    <ul><li><b>Moral restraint:</b> delaying marriage without sex outside it. Malthus thought only the virtuous (in practice, the better-off) practiced it.</li>
      <li><b>Vice:</b> includes birth control, which he condemned.</li>
      <li><b>Misery:</b> hunger, disease, early death.</li></ul>
    <p class="callout"><b>Why it matters (Hunt):</b> this turns the theory into a <i>moral</i> story. The rich are rich because they are restrained, and the poor are poor because they aren’t. Malthus said the poor spend any surplus at the “ale-house.”</p>

    <h2 id="n5">5. How this becomes a theory of wages</h2>
    <div class="flow">Wages rise above subsistence<br>↓ workers marry earlier and have more children<br>↓ population and the labor supply grow<br>↓ more workers competing, more mouths, limited food<br>↓ wages fall back to <b>subsistence</b> (sometimes below → positive checks)<br>↓ population growth slows until wages recover… and the cycle repeats</div>
    <p>In the long run, wages tend toward the <b>subsistence level</b>: just enough to survive and replace the workforce. Later economists called this the <b>subsistence theory of wages</b> or the <b>“iron law of wages.”</b> Hunt doesn’t use those labels, but it’s the mechanism the theory implies.</p>
    <h3>The “18 pence to 5 shillings” example</h3>
    <p>Malthus imagined the rich raising laborers’ pay from 18 pence a day to 5 shillings. He argued workers would feel rich, <b>work less</b>, and give a “check to productive industry,” so the nation and the workers would both end up <i>worse off</i>. Raising wages fails twice: in the short run through less effort, and in the long run through more population.</p>

    <h2 id="n6">6. Malthus’s policy conclusions</h2>
    <ol><li><b>Against redistribution:</b> it just creates more poor people who fall back to subsistence.</li>
      <li><b>Against the Poor Laws:</b> they increase population <i>without</i> increasing food, and give food to people in workhouses instead of “more industrious and more worthy” members. This fed campaigns against the Speenhamland system (1795).</li>
      <li><b>Poverty is inevitable:</b> some people “in the great lottery of life, have drawn a blank.”</li>
      <li><b>Property and inequality are necessary:</b> he credited private property and “self-love” with every achievement of civilization.</li>
      <li><b>The extreme passage:</b> taken to its logical end, he wrote, society should stop fighting mortality: narrower streets, crowded housing, and no cures for specific diseases.</li>
      <li>He closed the first Essay by appealing to God: suffering is a necessary ingredient in a process that produces far more happiness.</li></ol>

    <h2 id="n7">7. Hunt’s critique</h2>
    <ul><li>The theory was a <b>defense of the wealthy</b> against reformers like Godwin and Condorcet.</li>
      <li>It <b>blames the poor</b> for poverty instead of the class structure, low wages, or the Combination Acts that outlawed unions.</li>
      <li>Its lasting message, in Hunt’s words: poverty is inevitable, “little or nothing can be done about it,” and it is due to the poor’s own weakness.</li>
      <li><b>Inconsistency:</b> in his <i>Principles of Political Economy</i> (1820) and theory of gluts, Malthus mostly dropped the population argument. He opposed higher wages because they <b>lower profits</b> and weaken the motive to accumulate. Hunt says this reflects class loyalty more than logic.</li></ul>

    <h2 id="n8">8. Legacy</h2>
    <ul><li>The theory <b>inspired Charles Darwin’s</b> natural selection.</li><li>Versions of it are still used in debates about less-developed countries.</li></ul>
    <h3>Critiques from outside the chapter (useful for essays)</h3>
    <ul><li><b>Technology:</b> farm productivity grew far faster than “arithmetic.”</li><li><b>Demographic transition:</b> as countries get richer, birth rates usually fall.</li><li><b>Real wages</b> in industrial countries rose far above subsistence.</li></ul>

    <h2 id="n9">9. Cheat sheet</h2>
    <div class="tw"><table><thead><tr><th>Term</th><th>Meaning</th></tr></thead><tbody>
      <tr><td>Geometric progression</td><td>Population doubling (1, 2, 4, 8…), about every 25 years unchecked</td></tr>
      <tr><td>Arithmetic progression</td><td>Food growing by a constant amount at most (1, 2, 3, 4…)</td></tr>
      <tr><td>Preventive check</td><td>Lowers the birth rate</td></tr>
      <tr><td>Positive check</td><td>Raises the death rate</td></tr>
      <tr><td>Moral restraint</td><td>Delaying marriage without sex outside it</td></tr>
      <tr><td>Subsistence wage</td><td>The wage level population pressure pushes workers back to</td></tr>
      <tr><td>Poor Laws / Speenhamland</td><td>Welfare Malthus opposed as raising population without raising food</td></tr>
      <tr><td>Godwin &amp; Condorcet</td><td>The reformers the 1798 Essay attacked</td></tr>
      <tr><td>Theory of gluts</td><td>His later theory; there he opposed higher wages because they cut profits</td></tr></tbody></table></div>

    <h2 id="n10">10. Test yourself</h2>
    <ol><li>Why does geometric vs. arithmetic growth guarantee a problem in Malthus’s view?</li>
      <li>Name two preventive checks and two positive checks.</li>
      <li>Walk through how a wage increase ends up back at subsistence.</li>
      <li>What did Malthus predict if pay rose from 18 pence to 5 shillings, and why?</li>
      <li>Give Malthus’s two objections to the Poor Laws.</li>
      <li>How does “moral restraint, vice and misery” support Hunt’s claim that the theory blames the poor?</li>
      <li>In the <i>Principles</i>, what new reason did Malthus give for opposing higher wages?</li>
      <li>Name one real-world development that contradicts Malthus’s predictions.</li></ol>
    <div class="actions"><button class="btn ghost" data-go="home">Back to the game</button><button class="btn" data-tut="setup">Play pass-and-play</button></div>
  </div></div></div>`;
  watchNotes();
}

function startPractice(filter='all', only=null){
  const pool = only || QUIZ.map((_,i)=>i).filter(i=>filter==='all'||QUIZ[i].s===filter);
  const rng = mulberry(hash('p'+Date.now()));

}

    const bySec = QSECTIONS.map(([s,l])=>{const qs=P.order.filter(i=>QUIZ[i].s===s); if(!qs.length) return ''; const ok=qs.filter(i=>P.picks[i]===QUIZ[i].a).length;

      <div style="display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:8px"><span class="big ${pct>=60?'up-t':'down-t'}">${pct}%</span><span style="font-size:18px">${correct} of ${total} correct</span></div>

      <div class="pfoot"><button class="btn ghost" data-go="notes" style="background:transparent;color:var(--ink)">Open the study notes</button>
        <div style="display:flex;gap:8px;flex-wrap:wrap">${missed.length?`<button class="btn" data-do="pretry">Retry the ${missed.length} I missed</button>`:''}<button class="btn" data-do="prestart">Start over</button></div></div></div>`;
    if(once('pdone|'+P.order.join(',')+'|'+correct) && pct>=80) setTimeout(confetti, 150);
  } else {
    const qi = P.order[P.i], q = QUIZ[qi], pick = P.picks[qi], done = pick!=null, ok = pick===q.a;
    body = `<div class="pcard ${once('pq|'+P.order.join(',')+'|'+P.i)?'pop-in':''}">
      <div class="eyebrow">${esc(secName(q.s))}</div>
      <div class="qtext">${esc(q.q)}</div>
      <div class="popts">${P.perms[qi].map((oi,n)=>{
        const cls = !done ? '' : oi===q.a ? 'right' : oi===pick ? 'wrong' : 'faded';

      ${done?`<div class="pexplain ${ok?'ok':'no'}"><h4 class="${ok?'up-t':'down-t'}">${ok?'Correct!':'Not quite.'}</h4>
        ${ok?'':`<p>The answer is <b class="up">${esc(q.o[q.a])}</b>.</p>`}
        <p><b>What it asks:</b> ${esc(q.x)}</p><p><b>Why:</b> ${esc(q.e)}</p></div>`:''}

let notesObs = null;
function watchNotes(){
  if(notesObs) notesObs.disconnect();
  if(!('IntersectionObserver' in window)) return;
  notesObs = new IntersectionObserver(entries=>{
    const vis = entries.filter(e=>e.isIntersecting).sort((a,b)=>a.boundingClientRect.top-b.boundingClientRect.top)[0];
    if(vis) markSec(vis.target.id);
  }, {rootMargin:'0px 0px -65% 0px'});
  document.querySelectorAll('.notes h2[id]').forEach(h=>notesObs.observe(h));
}
function markSec(id){
  document.querySelectorAll('.outline button.sec').forEach(b=>{
    const on = b.dataset.sec===id; b.classList.toggle('on', on);
    if(on && window.innerWidth<=900){ const nav=b.parentElement; nav.scrollLeft = b.offsetLeft - nav.clientWidth/2 + b.offsetWidth/2; }
  });
}
