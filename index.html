  const parish = `<div class="panel">
    <div class="yearline"><div><div class="eyebrow lbl">${st.over?'The final reckoning':'Season '+r+' of '+st.maxRounds} ${hint('season')}</div><div class="year">${st.over?'1833':yearOf(st.round,st)}</div></div>
      <div class="pips" aria-hidden="true">${Array.from({length:st.maxRounds},(_,i)=>`<span class="pip ${i+1<st.round?'done':i+1===st.round&&!st.over?'now':''}"></span>`).join('')}</div></div>
    <div class="stats">
      <div class="stat pop"><div class="s">Mouths ${hint('pop')}</div><div class="v">${pop}</div><div class="s">grows by % (geometric)</div></div>
      <div class="stat food"><div class="s">${st.over?'Last harvest':'Harvest'} ${hint('food')}</div><div class="v">${st.over?last.food:nextFood}</div><div class="s">+${st.growth} a season (arithmetic)</div></div>
      <div class="stat wage"><div class="s">Last real wage ${hint('wage')}</div><div class="v">${w.toFixed(2)}</div>${wtag}</div>
    </div>
    <div class="charts">
      <div><div class="eyebrow lbl">Mouths vs. loaves ${hint('chartpf')}</div>${chartSVG(st.history,'pf')}<div class="legend"><span><i style="background:var(--madder)"></i>Population</span><span><i style="background:var(--wheat)"></i>Food available</span></div></div>
      <div><div class="eyebrow lbl">Real wage (loaves per head) ${hint('chartw')}</div>${chartSVG(st.history,'w')}<div class="legend"><span><i style="background:var(--indigo)"></i>Wage</span><span><i style="background:var(--paper)"></i>Subsistence = 1</span></div></div>
    </div>
    ${st.over?'':`<div class="event-now">${eventCard(evId, once('ev|'+st.seed+'|'+st.round)?'flip':'')}<div><div class="eyebrow lbl">This season’s event ${hint('event')}</div><p>Drawn now, it takes effect when the season resolves. Plan around it.</p>
      <p style="font-size:13px">${st.cornLaw?'<b class="down">Corn Law in force:</b> landlords take 10% of the harvest. ':''}Poor relief covers up to ${st.reliefCap} loaves. Combination risk ${Math.round(st.unionRisk*100)}%.${st.poorRate?` <b class="down">Poor rate owed: ${st.poorRate} loaves</b> come off this harvest.`:''}</p></div></div>`}
  </div>`;

  const side = `<div class="panel"><div class="head"><h2>The households</h2><span class="eyebrow lbl">Legacy is your score ${hint('legacy')}</span></div>
    <div class="houses">${houses}</div>
    <p class="key">Each figure is one person: <span><i class="person"></i>living</span>, <span><i class="person gone"></i>emigrated or left home</span>, <span><i class="person lost"></i>lost</span>.</p>
    <p class="parish-npc" style="margin-top:12px">The rest of the parish: <b class="num" style="color:var(--text);margin-inline:4px">${st.npc}</b> laboring poor, who marry early whenever wages allow. ${hint('npc')}</p></div>`;

  const yr = yearOf(st.round,st);
  const waitingOn = st.order.filter(id=>!ctx.ready.has(id)).map(id=>esc(st.players[id].name)).join(', ');
  let lower = '';
  if(st.over) lower = finalBlock(st);
  else if(ctx.spectator) lower = `<div class="waiting hand"><h3>You’re watching this parish</h3><p>This game began before you joined. Open a new room from the lobby to play.</p></div>`;
  else if(ctx.mode==='local') lower = `<div class="board-cta"><div><h3>Season ${st.round} of ${st.maxRounds} · ${yr}</h3><p>Look over the parish, then pass the device to <b>${esc(st.players[st.order[0]].name)}</b> to take the first turn.</p></div><button class="btn" data-do="begin-season">Begin season ${st.round}</button></div>`;
  else if(ctx.locked) lower = `<div class="board-cta"><div><h3>Locked in for ${yr}</h3><p>Waiting for ${waitingOn||'the harvest'}…</p>${ctx.isHost?'<p><button class="link" data-do="force-resolve">Resolve now (anyone still deciding plays Moral Restraint with no action)</button></p>':''}</div></div>`;
  else lower = `<div class="board-cta"><div><h3>Season ${st.round} of ${st.maxRounds} · ${yr}</h3><p>Look over the parish, then take your turn.${waitingOn?` Still deciding: ${waitingOn}.`:''}</p></div><button class="btn" data-do="take-turn">Take my turn</button></div>`;

  $app.innerHTML = `${topbar(codeChip)}<div class="board">${parish}${side}</div>${lower}`;
}

function curtainScreen(st, me, codeChip){
  const n = esc(st.players[me].name);
  $app.innerHTML = `${topbar(codeChip)}<div class="waiting curtain" style="max-width:560px;margin:40px auto"><div class="card back"></div><h3>Pass the device to ${n}</h3><p>Everyone else, look away. ${n}’s hand stays hidden until they’re ready.</p><button class="btn" data-do="reveal-hand">I’m ${n}: show my hand</button></div>`;
}

function turnScreen(st, me, codeChip){
  const p = st.players[me];
  const key = st.seed+'|'+st.round+'|'+me;
  if(sel.key !== key) sel = {key, family:null, action:null, actionIdx:null, quiz:null};
  const deal = once('deal|'+key);
  const q = QUIZ[st.quiz[st.round-1]];
  const evId = st.events[st.round-1];
  const pop = st.order.reduce((a,id)=>a+st.players[id].family,0) + st.npc;
  const harvest = r1(st.food + (st.round>1?st.growth:0));
  const w = st.lastWage, wk = w<.95?'down':w>=1.05?'up':'neutral';
  const famSum = sel.family ? FAMILY[sel.family].title : '<span class="down-t">pick a household card</span>';
  const actSum = sel.action ? ACTIONS[sel.action].title : 'no action';
  $app.innerHTML = `${topbar(codeChip)}
  <section class="turn">
    <div class="turn-head">
      <div><div class="eyebrow">Season ${st.round} of ${st.maxRounds} · ${yearOf(st.round,st)}</div><h2>${esc(p.name)}’s turn</h2></div>
      <div class="glance"><span class="lbl">Parish ${hint('glance')}</span><span>Last wage <b class="${wk}">${w.toFixed(2)}</b></span><span>Harvest <b>${harvest}</b></span><span>Mouths <b>${pop}</b></span>${st.poorRate?`<span>Poor rate <b class="down">−${st.poorRate}</b></span>`:''}${st.cornLaw?'<span><b class="down">Corn Law in force</b></span>':''}</div>
    </div>
    <div class="turn-grid">
      <aside class="turn-side">
        <div><div class="eyebrow lbl" style="margin-bottom:6px">This season’s event ${hint('event')}</div>${eventCard(evId, deal?'flip':'')}</div>
        <div class="mystats"><div class="top" style="display:flex;justify-content:space-between;align-items:center"><span class="nm">${esc(p.name)}</span>${hint('pstats')}</div>
          <div class="people">${people(p)}</div>
          <div class="ledger"><div>Family<b>${p.family}</b></div><div>Savings<b>${r1(p.savings)}</b></div><div>Comfort<b>${r1(p.comfort)}</b></div><div>Legacy<b>${score(p)}</b></div></div>
          <div class="parson">${PARSON(p.virtue)}</div></div>
      </aside>
      <div class="turn-main">
        <div class="eyebrow lbl">1. How will your family marry this season? Pick one of the 3 you were dealt ${hint('famcards')}</div>
        <div class="cards">${(p.famHand||['early','late','control']).map((k,i)=>familyCard(k,{state:st,selected:sel.family===k,dim:sel.family&&sel.family!==k,cls:deal?'flip':'',d:deal?i*110:null})).join('')}</div>
        <div class="eyebrow lbl" style="margin-top:12px">2. Parish actions in your hand (optional) ${hint('actcards')}</div>
        <div class="cards">${p.hand.map((k,i)=>actionCard(k,{state:st,player:p,selected:sel.action===k&&sel.actionIdx===i,idx:i,cls:deal?'flip':'',d:deal?330+i*110:null})).join('')}</div>
      </div>
      <aside class="turn-right">
        <div class="quiz"><div class="eyebrow lbl">3. Question · +1 savings ${hint('quiz')}</div>
          <div class="q">${esc(q.q)}</div>
          <div class="opts">${shuffle(q.o.map((_,i)=>i), mulberry(hash(st.seed+'|qo'+st.round+'|'+me))).map(i=>`<button class="opt${sel.quiz===i?' sel':''}" data-quiz="${i}">${esc(q.o[i])}</button>`).join('')}</div></div>
        <div class="choices"><div class="eyebrow lbl">Your choices ${hint('lock')}</div>
          <dl><div><dt>Household</dt><dd>${famSum}</dd></div><div><dt>Action</dt><dd>${actSum}</dd></div><div><dt>Question</dt><dd>${sel.quiz==null?'<span class="dim-t">unanswered</span>':esc(q.o[sel.quiz])}</dd></div></dl>
          <button class="btn lockbtn" data-do="lock" ${sel.family?'':'disabled'}>Lock in for ${yearOf(st.round,st)}</button></div>
      </aside>
    </div>
  </section>`;
}

function storyOf(st){
  const h = st.history, first = h[0], last = h[h.length-1], rounds = h.slice(1);
  const pct = (a,b) => Math.round((b-a)/a*100);
  const pP = pct(first.pop,last.pop), pF = pct(first.food,last.food);
  const below = rounds.filter(r=>r.wage<1).length;
  let hi = rounds[0], lo = rounds[0], cross = 0;
  rounds.forEach((r,i)=>{ if(r.wage>hi.wage) hi=r; if(r.wage<lo.wage) lo=r; const prev = i? rounds[i-1].wage : first.wage; if((prev>=1)!==(r.wage>=1)) cross++; });
  const pf = pP > pF
    ? `Population went from <b>${first.pop}</b> to <b>${last.pop}</b> (<b>${pP>=0?'+':''}${pP}%</b>), while the food available went from <b>${first.food}</b> to <b>${last.food}</b> (<b>${pF>=0?'+':''}${pF}%</b>). Mouths grew faster than loaves, just as Malthus predicted: births compound, but the harvest only adds a fixed amount each season.`
    : `Population went from <b>${first.pop}</b> to <b>${last.pop}</b> (<b>${pP>=0?'+':''}${pP}%</b>), while food went from <b>${first.food}</b> to <b>${last.food}</b> (<b class="up">${pF>=0?'+':''}${pF}%</b>). Here food kept pace with mouths, because restraint, land improvements, emigration, or the positive checks (deaths from hunger and disease) held population down. Ask which of those did the work in your game.`;
  const wg = `The wage started at <b>${first.wage.toFixed(2)}</b> and ended at <b class="${last.wage<1?'down':'up'}">${last.wage.toFixed(2)}</b>. It fell below subsistence in <b class="${below?'down':'up'}">${below} of ${rounds.length}</b> seasons. The high point was <b>${hi.wage.toFixed(2)}</b> in ${hi.year} and the low point was <b>${lo.wage.toFixed(2)}</b> in ${lo.year}. `
    + (cross>=2 ? `The line crossed the dashed subsistence line <b>${cross} times</b>. That is the Malthusian wage cycle: every surplus brought more births, and every shortfall brought hunger and deaths, pulling the wage back toward 1.`
      : `The line stayed mostly on one side of subsistence. Malthus would say that can’t last: a lasting surplus invites more births, and a lasting shortfall thins the population until the wage recovers.`);
  return {pf, wg};
}
function roundNote(r){
  if(r.wage < .95) return '<b class="down">Positive check:</b> shortfall, savings drained, deaths';
  if(r.wage < 1.05) return '<b>At subsistence:</b> births and food barely balanced';
  return '<b class="up">Surplus:</b> expect a birth surge next season';
}
function finalBlock(st){
  const ranked = st.order.map(id=>st.players[id]).sort((a,b)=>score(b)-score(a));
  const virt = st.order.map(id=>st.players[id]).sort((a,b)=>b.virtue-a.virtue)[0];
  const story = storyOf(st);
  const rows = st.history.slice(1).map((r,i)=>{
    const ev = EVENTS.find(e=>e.id===r.ev);
    const top = r.picks ? Object.entries(r.picks).sort((a,b)=>b[1]-a[1])[0] : null;
    return `<tr><td class="n" style="text-align:left">${i+1}<div style="font-size:11px;color:var(--ink-soft)">${r.year}</div></td>
      <td>${ev?esc(ev.title):'—'}</td>
      <td class="n"><b class="${r.wage<1?'down':r.wage>=1.05?'up':'neutral'}">${r.wage.toFixed(2)}</b></td>
      <td>${r.births!=null?`<b class="up">+${r.births}</b> / <b class="${r.lost?'down':'neutral'}">−${r.lost}</b>`:'—'}</td>
      <td>${r.npcB!=null?`<b class="up">+${r.npcB}</b> / <b class="${r.npcD?'down':'neutral'}">−${r.npcD}</b>`:'—'}</td>
      <td>${top?`${esc(FAMILY[top[0]].title)}${top[1]>1?` ×${top[1]}`:''}`:'—'}</td>
      <td style="font-size:12.5px">${roundNote(r)}${r.relief?`; relief paid ${r.relief}`:''}</td></tr>`;
  }).join('');
  return `<section class="hand"><div class="sheet" style="max-width:none">
    <div class="eyebrow">1833 · Malthus dies the following year</div><h2>The final reckoning</h2>
    <div class="final-rank">${ranked.map((p,i)=>`<div class="rankrow${i===0?' winner':''}"><span class="pos">${i+1}</span><div><div style="font-family:var(--display);font-size:20px">${esc(p.name)}${i===0?' <span class="crown">♛</span>':''}</div><div class="br">${p.family} living · ${p.emigrants} left home · ${r1(p.savings)} saved · ${r1(p.comfort)} comfort · <b class="${p.deaths?'down':'neutral'}">${p.deaths} lost</b> · ${PARSON(p.virtue)}</div></div><span class="sc">${score(p)}</span></div>`).join('')}</div>

    <div class="sec-h"><h3>What the graphs show</h3></div>
    <div class="finalcharts">
      <div class="chartbox"><div class="eyebrow">Mouths vs. loaves</div>${chartSVG(st.history,'pf')}<div class="legend"><span><i style="background:var(--madder)"></i>Population</span><span><i style="background:var(--wheat)"></i>Food available</span></div></div>
      <p>${story.pf}</p>
      <div class="chartbox"><div class="eyebrow">Real wage (loaves per head)</div>${chartSVG(st.history,'w')}<div class="legend"><span><i style="background:var(--indigo)"></i>Wage</span><span><i style="background:var(--paper)"></i>Subsistence = 1</span></div></div>
      <p>${story.wg}</p>
    </div>

    <div class="sec-h"><h3>Season by season</h3></div>
    <div class="tblwrap"><table><thead><tr><th>Season</th><th>Event</th><th style="text-align:right">Wage</th><th>Households born / lost</th><th>Rest of parish born / died</th><th>Most chosen</th><th>What it shows</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="voices">
      <div class="voice m"><div class="who">Malthus would say</div><div class="say">Your parish shows the principle at work. Whenever wages rose, marriages followed and wages fell again. Only the prudent, who practiced moral restraint, kept anything.</div></div>
      <div class="voice h"><div class="who">Hunt would answer</div><div class="say">Look at who carried the losses: whoever had no savings to fall back on. Malthus treated that as moral failure. It was the structure of property, rents and wages.</div></div>
    </div>
    <div class="insight"><b>Discuss:</b> The parson liked <b>${esc(virt.name)}</b> best. Did virtue predict Legacy in your game? What happened to the wage whenever everyone “married young” at once? And did relief, emigration or land improvement ever break the trap for good, or only delay it?</div>
    <div class="actions"><button class="btn ghost" data-open="guide">Review the theory</button><button class="btn" data-go="home">Play again</button></div>
  </div></section>`;
}

/* ---------- tutorial ---------- */
function tutSteps(){
  const mp = (n,g=0,l=0)=>`<div class="mini-people">${'<span></span>'.repeat(n)}${'<span class="gone"></span>'.repeat(g)}${'<span class="lost"></span>'.repeat(l)}</div>`;
  const geo=[1,2,4,8,16,32], ari=[1,2,3,4,5,6];
  const bars = `<svg viewBox="0 0 260 170" style="width:100%;max-width:300px" role="img" aria-label="Geometric population bars outgrow arithmetic food bars">
    ${geo.map((v,i)=>`<rect x="${14+i*40}" y="${150-v*4.2}" width="14" height="${v*4.2}" fill="#c2553b"/><rect x="${30+i*40}" y="${150-ari[i]*4.2}" width="14" height="${ari[i]*4.2}" fill="#dca845"/><text x="${29+i*40}" y="164" font-size="10" text-anchor="middle" fill="#6b5f52">${i*25}y</text>`).join('')}
    <text x="14" y="12" font-size="11" fill="#c2553b">■ population 1, 2, 4, 8…</text><text x="14" y="26" font-size="11" fill="#8a5a14">■ food 1, 2, 3, 4…</text></svg>`;
  return [
    {t:'You head a household', vis:`${mp(6)}<div style="width:100%;text-align:center;font-size:13px;color:var(--ink-soft)">6 people, 2 savings, England, 1798</div>`,
      b:`<p>Each player runs a working family in one English parish. The game lasts a set number of <b>seasons</b> between 1798 and 1833.</p><p>Your goal is the highest <b>Legacy</b> by the end: the people who survive, plus what you’ve saved and the comfort you’ve enjoyed.</p>`},
    {t:'Pick one household card', vis:familyCard('early',{tag:'div'})+familyCard('late',{tag:'div'}),
      b:`<p>Every season you choose <b>how your family marries</b>. Each card adds births as a <b>percentage</b> of your family.</p><ul><li><b class="up">Green</b> words are gains and <b class="down">red</b> words are costs.</li><li>Think about the wage before you choose. More children means more mouths when the harvest is split.</li></ul>`},
    {t:'Mouths multiply, loaves add up', vis:bars,
      b:`<p>Births compound, so population grows <b>geometrically</b>. The parish harvest only grows by a fixed amount each season, which is <b>arithmetic</b> growth.</p><p>That gap is Malthus’s whole argument, and you’ll watch it happen on the board’s charts.</p>`},
    {t:'The wage decides everything', vis:`<div style="width:100%"><div class="formula">48 loaves ÷ 40 mouths = 1.20<small>harvest ÷ population = real wage</small></div><div class="gauge" style="margin-inline:auto"><i style="left:68%"></i></div></div>`,
      b:`<p>At harvest, every person gets the <b>real wage</b> in loaves. <b>1.00 is subsistence.</b></p><ul><li>Above 1: your family saves the <b class="up">surplus</b>.</li><li>Below 1: <b class="down">savings drain</b> first, then relatives die.</li></ul><p>The rest of the parish has more children whenever wages rise, which pulls the wage back down.</p>`},
    {t:'Actions and events', vis:actionCard('relief',{tag:'div'})+`<div style="transform:scale(.9)">${eventCard('dearth')}</div>`,
      b:`<p>You hold <b>3 action cards</b>, such as poor relief, joining a union, emigrating or improving the land. Play <b>one or none</b> each season. Cards you can’t afford yet are <b>greyed out</b>.</p><p>An <b>event card</b> is revealed at the start of each season and strikes at harvest, so plan around it.</p><p>Each turn gets its own screen: the event, your household, and your cards. Between seasons, everyone looks at the full parish board together.</p>`},
    {t:'The question and the report', vis:`<div class="quiz" style="margin:0;max-width:260px"><div class="eyebrow">Question</div><div class="q" style="font-size:15px">Which is a PREVENTIVE check?</div><div class="opts"><span class="opt">Famine</span><span class="opt sel">Late marriage</span></div></div>`,
      b:`<p>Answer one question about Malthus each season for <b class="up">+1 savings</b>.</p><p>After the harvest, a <b>parish ledger</b> shows what happened to each household, explains the question, and gives you Malthus’s view and Hunt’s critique side by side.</p>`},
    {t:'Scoring and hints', vis:`<div style="text-align:center"><div class="formula" style="font-size:17px">Legacy = family + emigrants<br>+ savings + comfort<br><b class="down">− 2 × each relative lost</b></div></div>`,
      b:`<p>The parson judges your morals the way Malthus would, but his opinion <b>doesn’t score</b>. Check whether virtue actually pays.</p><p>Tap any <span class="bulb" style="display:inline-flex">${BULB}</span> during the game for a quick explanation. You can switch hints off with the toggle at the top.</p>`}
  ];
}
function tutorialSheet(){
  const steps = tutSteps(), i = tut.step, s = steps[i], lastStep = i===steps.length-1;
  return `<div class="overlay"><div class="sheet tut" role="dialog" aria-label="How to play">
    <div class="steps" aria-hidden="true">${steps.map((_,j)=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div>
    <div class="eyebrow">How to play · ${i+1} of ${steps.length}</div>
    <div class="body"><div class="vis">${s.vis}</div><div><h2>${s.t}</h2>${s.b}</div></div>
    <div class="foot"><button class="btn ghost" data-do="tut-skip">Skip tutorial</button>
      <div class="r">${i>0?'<button class="btn ghost" data-do="tut-back">Back</button>':''}<button class="btn" data-do="${lastStep?'tut-skip':'tut-next'}">${lastStep?(tut.next?'Let’s play':'Done'):'Next'}</button></div></div>
  </div></div>`;
}

function renderLayer(){
  if(overlay==='tutorial'){ $layer.innerHTML = tutorialSheet(); return; }
  if(overlay==='guide'){ $layer.innerHTML = `<div class="overlay" data-close><div class="sheet guide" role="dialog" aria-label="Field guide">
    <div class="eyebrow">Field guide</div><h2>How the game models Malthus</h2>
    <p>The Great Lottery is a working model of Malthus’s population theory from his 1798 <i>Essay on the Principle of Population</i>, as Hunt and Lautzenheiser present it in Chapter 4.</p>
    <div class="map">
      <div>Population grows geometrically</div><div>Births are a percentage of each family, so growth compounds. The rest of the parish breeds harder when wages are high.</div>
      <div>Food grows arithmetically</div><div>The harvest adds a fixed amount each season. Improving the land adds less each time (diminishing returns).</div>
      <div>The real wage</div><div>Food available ÷ total population. 1.0 loaf a head is subsistence.</div>
      <div>Preventive checks (fewer births)</div><div>Moral Restraint, Wait for Good Times, Prevent Births, and hunger halving births when the wage is below 1.</div>
      <div>Positive checks (more deaths)</div><div>Shortfalls you can’t cover kill family members. So do typhus, cholera, war and harvest failure.</div>
      <div>Moral restraint, vice and misery</div><div>The parson’s opinion tracks Malthus’s moral judgments. It never scores, so you can test whether virtue actually pays.</div>
      <div>Poor Laws and the workhouse</div><div>Relief saves your family but costs the whole parish food the next season. That is Malthus’s objection.</div>
      <div>Combination Act, Corn Laws, mills</div><div>Hunt’s history: the class conflicts of Malthus’s times.</div>
    </div>
    <h3>The wage cycle to watch for</h3>
    <p>Wage above 1 → surplus and more marriages → population jumps → wage falls below 1 → savings drain, deaths → population falls back → wage recovers… Malthus claimed this cycle keeps workers near subsistence forever.</p>
    <h3>Hunt’s critique, in play</h3>
    <ul><li>Malthus blamed poverty on the poor’s lack of restraint. In the game, whoever has no savings buffer suffers first, whatever their virtue.</li>
    <li>He opposed all redistribution. Try relief and see who pays for it and who gains.</li>
    <li>Later, in his <i>Principles</i> (1820), he opposed higher wages because they cut profits, not because of population.</li></ul>
    <div class="actions"><button class="btn" data-close>Back to the table</button></div></div></div>`; return; }
  if(overlay==='report'){ const st = currentState(); if(st && st.report){ $layer.innerHTML = reportSheet(st); if(once('count|'+st.seed+'|'+st.report.round)) countUp(); return; } }
  $layer.innerHTML = '';
}

/* ---------- little celebrations ---------- */
const reduced = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches }catch(e){ return false } };
function countUp(){
  if(reduced()) return;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to = +el.dataset.count, t0 = performance.now(), dur = 900;
    const step = t => { const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3); el.textContent = (to*e).toFixed(2); if(k<1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
function showStamp(text){
  if(reduced()) return;
  const el = document.createElement('div'); el.className='stamp'; el.textContent=text; document.body.appendChild(el);
  setTimeout(()=>el.remove(), 950);
}
function confetti(){
  if(reduced()) return;
  const box = document.createElement('div'); box.className='confetti';
  const cols = ['#dca845','#eee6d3','#c2553b','#7fa3cf','#8fc29a'];
  for(let i=0;i<70;i++){
    const c = document.createElement('i');
    c.style.left = Math.random()*100+'vw'; c.style.background = cols[i%cols.length];
    c.style.animationDuration = (2.2+Math.random()*2)+'s'; c.style.animationDelay = (Math.random()*.8)+'s';
    c.style.transform = `rotate(${Math.random()*360}deg)`;
    box.appendChild(c);
  }
  document.body.appendChild(box); setTimeout(()=>box.remove(), 5200);
}

function lineHTML(x){
  if(typeof x==='string') return `<div class="ln">${esc(x)}</div>`;
  return `<div class="ln">${esc(x.l)}: <b class="${x.k}">${esc(x.v)}</b></div>`;
}
function reportSheet(st){
  const R = st.report, ev = EVENTS.find(e=>e.id===R.event), q = QUIZ[R.quiz];
  const rows = st.order.map(id=>{
    const p=st.players[id], c=R.chose[id], s0=(R.start||{})[id];
    const df = s0 ? p.family - s0.family : 0, dl = s0 ? score(p) - s0.legacy : 0;
    const d = v => v ? ` <b class="${v>0?'up':'down'}">(${v>0?'+':''}${v})</b>` : '';
    return `<tr><td><b>${esc(p.name)}</b><div style="font-size:11.5px;color:var(--ink-soft)">${FAMILY[c.family].title}${c.action?' · '+ACTIONS[c.action].title:''}</div></td>
      <td>${(R.lines[id]||[]).map(lineHTML).join('') || '<div class="ln">A quiet season.</div>'}</td><td class="n">${p.family}${d(df)}</td><td class="n">${score(p)}${d(dl)}</td></tr>`;
  }).join('');
  const whoRight = st.order.map(id=>{const ok=R.answers[id]===q.a;return `<b class="${ok?'up':'down'}">${ok?'✓':'✗'} ${esc(st.players[id].name)}</b>`}).join(' &nbsp; ');
  return `<div class="overlay"><div class="sheet" role="dialog" aria-label="Harvest report ${R.year}">
    <div class="toprow">${eventCard(R.event, once('rep|'+st.seed+'|'+R.round)?'flip':'')}
      <div class="col"><div class="eyebrow">Parish ledger · harvest of ${R.year}</div><h2>${ev.title}</h2>
        <div style="display:flex;gap:28px;flex-wrap:wrap;margin-top:14px">
          <div><div class="eyebrow lbl">Real wage ${hint('rwage')}</div><div class="bigw ${R.wage<1?'down-t':R.wage>=1.05?'up-t':''}"><span data-count="${R.wage}">${R.wage.toFixed(2)}</span> <small>loaves / head</small></div></div>
          <div><div class="eyebrow">Food ÷ mouths</div><div class="bigw" style="font-size:28px">${R.avail} ÷ ${R.pop}</div></div>
        </div>
        <p style="font-size:13px;margin:10px 0 0">Households: <b class="up">+${R.births} born</b>, <b class="${R.deaths?'down':'neutral'}">${R.deaths} lost to want</b>. Rest of the parish: <b class="up">+${R.npcBirths} born</b>, <b class="${R.npcDeaths?'down':'neutral'}">${R.npcDeaths} died</b>.${R.reliefPaid?` Relief paid: <b class="down">${R.reliefPaid} loaves</b> owed next season.`:''}</p>
      </div></div>
    <div class="insight">${esc(R.insight)}</div>
    <div class="sec-h"><h3>What happened to each household</h3>${hint('rtable')}</div>
    <div class="tblwrap"><table><thead><tr><th>Household</th><th>What happened</th><th style="text-align:right">Family</th><th style="text-align:right">Legacy</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="sec-h"><h3>The question, explained</h3>${hint('rexam')}</div>
    <div class="exam">
      <div class="row"><div>The question</div><div class="q">${esc(q.q)}</div></div>
      <div class="row"><div>What it asks</div><div>${esc(q.x||'')}</div></div>
      <div class="row"><div>Answer</div><div><b class="up">${esc(q.o[q.a])}</b></div></div>
      <div class="row"><div>Why</div><div>${esc(q.e)}</div></div>
      <div class="row"><div>Who got it</div><div>${whoRight}</div></div>
    </div>
    <div class="sec-h"><h3>Two voices</h3>${hint('rvoices')}</div>
    <div class="voices"><div class="voice m"><div class="who">Malthus says</div><div class="say">${esc(ev.m)}</div></div><div class="voice h"><div class="who">Hunt replies</div><div class="say">${esc(ev.h.replace(/^Hunt:\s*/,''))}</div></div></div>
    <div class="actions"><button class="btn" data-do="close-report">${st.over?'See the final results':'On to '+yearOf(st.round,st)}</button></div>
  </div></div>`;
}

/* ---------- hint popover ---------- */
function closePop(){ $pop.innerHTML=''; }
function openPop(btn){
  const h = HINTS[btn.dataset.hint]; if(!h) return;
  $pop.innerHTML = `<div id="pop" role="dialog" aria-label="${esc(h[0])}"><button class="x" data-do="close-pop" aria-label="Close hint">×</button><h4>${esc(h[0])}</h4><div>${h[1]}</div></div>`;
  const el = document.getElementById('pop'), r = btn.getBoundingClientRect(), vw = window.innerWidth, vh = window.innerHeight;
  const w = Math.min(300, vw-32); el.style.width = w+'px';
  let left = Math.min(Math.max(16, r.left + r.width/2 - w/2), vw - w - 16);
  el.style.left = left+'px';
  const hgt = el.offsetHeight;
  el.style.top = (r.bottom + 8 + hgt < vh ? r.bottom + 8 : Math.max(8, r.top - hgt - 8)) + 'px';
}

function currentState(){ return view==='local' ? local?.state : view==='room' ? online.room?.game : null }
function maybeShowReport(){
  const st = currentState(); if(!st || !st.report) return;
  const k = (view==='local'?'L':online.code)+'|'+st.seed+'|'+st.report.round;
  if(!seen[k]){ seen[k]=1; store.set('gl-seen', seen); overlay='report'; }
}

/* =========================================================
   LOCAL MODE
   ========================================================= */
function startLocal(){
  const names = keepNames() || [];
  const plist = names.map((n,i)=>({id:'p'+i, name:n})).filter(p=>p.name);
  if(!plist.length){ const f=document.getElementById('pn0'); f.placeholder='Enter at least one name'; f.style.borderColor='var(--down)'; f.focus(); return; }
  local = {state:newGame(plist, 'local-'+Date.now(), seasonsPick), moves:{}, turn:0, curtain:plist.length>1, phase:'board'};
  saveLocal(); view='local'; render();
}
function beginSeason(){ local.phase='turns'; local.turn=0; local.moves={}; local.curtain = local.state.order.length>1; saveLocal(); render(); window.scrollTo(0,0); }
function saveLocal(){ store.set('gl-local-save', local && !local.state.over && local.state.v===4 ? local : null) }
function lockLocal(){
  const st = local.state, me = st.order[local.turn];
  local.moves[me] = {family:sel.family, action:sel.action, quiz:sel.quiz};
  if(local.turn < st.order.length-1){ local.turn++; local.curtain = true; }
  else { local.state = resolveRound(st, local.moves); local.moves = {}; local.turn = 0; local.phase = 'board'; maybeShowReport(); }
  saveLocal(); render(); window.scrollTo({top:0,behavior:'smooth'});
}

/* =========================================================
   ONLINE MODE (db capability)
   rooms/{CODE}              room + game state
   rooms/{CODE}/moves/{uid}  each player's join + current move
   ========================================================= */
function watchRooms(){
  if(!caps.db || online.roomsUnsub) return;
  online.roomsUnsub = caps.db.collection('rooms').where('phase','==','lobby').limit(50).onSnapshot(
    snap => { online.rooms = snap.docs.map(d=>d.data()); renderRoomList(); }, () => {});
}
function myName(){ const el=document.getElementById('myname'); const n=(el?el.value:store.get('gl-name','')).trim(); if(n) store.set('gl-name',n); return n; }
function newCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
const accessMsg = 'You can view this page but not play online. Ask the owner for “can interact” access.';

async function createRoom(){
  const name = myName(); if(!name){ online.error='Enter a household name first.'; renderLobby(); return; }
  const code = newCode();
  try{
    await caps.db.doc('rooms/'+code).set({code, host:caps.uid, created:Date.now(), phase:'lobby'});
    await caps.db.doc(`rooms/${code}/moves/${caps.uid}`).set({name, round:0, joined:Date.now()});
    enterRoom(code);
  }catch(e){ online.error = e.code==='invalid_argument' ? accessMsg : 'Could not open a room ('+(e.code||'error')+'). Try again.'; renderLobby(); }
}
async function joinRoom(code){
  code = String(code||'').toUpperCase().trim();
  const name = myName(); if(!name){ online.error='Enter a household name first.'; renderLobby(); return; }
  try{
    const snap = await caps.db.doc('rooms/'+code).get();
    if(!snap.exists){ online.error='No room with code '+code+'.'; renderLobby(); return; }
    const mref = caps.db.doc(`rooms/${code}/moves/${caps.uid}`);
    const mine = await mref.get();
    if(!mine.exists) await mref.set({name, round:0, joined:Date.now()});
    enterRoom(code);
  }catch(e){ online.error = e.code==='invalid_argument' ? accessMsg : 'Could not join ('+(e.code||'error')+').'; renderLobby(); }
}
function leaveRoom(){ online.unsubs.forEach(u=>u()); online.unsubs=[]; online.code=null; online.room=null; online.moves={}; }
function enterRoom(code){
  leaveRoom(); online.code = code; online.error=''; view='room';
  if(online.roomsUnsub){ online.roomsUnsub(); online.roomsUnsub=null; }
  online.unsubs.push(caps.db.doc('rooms/'+code).onSnapshot(s=>{ online.room = s.exists ? s.data() : null; maybeShowReport(); render(); maybeResolve(); }, ()=>{}));
  online.unsubs.push(caps.db.collection(`rooms/${code}/moves`).onSnapshot(s=>{ const m={}; s.docs.forEach(d=>m[d.id]=d.data()); online.moves=m; render(); maybeResolve(); }, ()=>{}));
  render();
}
function renderRoom(){
  const room = online.room;
  if(!room){ $app.innerHTML = `${topbar()}<div class="waiting">Opening room ${esc(online.code)}…</div>`; return; }
  if(room.phase==='lobby'){
    const ids = Object.keys(online.moves).sort((a,b)=>(online.moves[a].joined||0)-(online.moves[b].joined||0));
    const isHost = room.host===caps.uid;
    $app.innerHTML = `${topbar(`<span class="chip">Room <b class="num">${esc(room.code)}</b></span>`)}
    <div class="panel" style="max-width:680px;margin:0 auto">
      <div class="eyebrow">Gathering the parish</div><h2 style="font-size:34px">Room <span class="num" style="color:var(--wheat)">${esc(room.code)}</span></h2>
      <p style="color:var(--text-dim)">Tell classmates to open this page, go to the <b>Online parish</b> lobby, and join <b class="num">${esc(room.code)}</b>. Up to 6 households.</p>
      <div class="houses" style="margin-block:14px">${ids.map(id=>`<div class="house${id===caps.uid?' me':''}"><div class="top"><span class="nm">${esc(online.moves[id].name)}${id===room.host?' <span style="font-family:var(--ui);font-size:11px;color:var(--wheat)">host</span>':''}</span><span class="st ready">ready</span></div></div>`).join('')}</div>
      ${isHost ? `${seasonStepper()}<button class="btn" data-do="start-online" ${ids.length<1?'disabled':''}>Begin in 1798 with ${Math.min(ids.length,6)} household${ids.length===1?'':'s'}</button>` : '<p class="notice">Waiting for the host to choose the number of seasons and begin…</p>'}
      <p style="margin-top:12px"><button class="link" data-go="lobby">Back to lobby</button></p>
    </div>`;
    return;
  }
  const st = room.game;
  const ready = new Set(st.order.filter(id=>online.moves[id] && online.moves[id].round===st.round));
  const inGame = st.order.includes(caps.uid);
  const locked = inGame && ready.has(caps.uid);
  if(online.screenRound !== st.round){ online.screenRound = st.round; online.screen = 'board'; }
  if(inGame && !locked && !st.over && online.screen==='turn') return turnScreen(st, caps.uid, `<span class="chip">Room <b class="num">${esc(online.code)}</b></span>`);
  renderGame(st, {mode:'online', me:caps.uid, locked, ready, spectator:!inGame, isHost: room.host===caps.uid});
}
async function startOnline(){
  const ids = Object.keys(online.moves).sort((a,b)=>(online.moves[a].joined||0)-(online.moves[b].joined||0)).slice(0,6);
  const game = newGame(ids.map(id=>({id, name:online.moves[id].name||'Household'})), online.code+'-'+Date.now(), seasonsPick);
  await caps.db.doc('rooms/'+online.code).set({...online.room, phase:'play', game});
}
async function lockOnline(){
  const st = online.room.game;
  await caps.db.doc(`rooms/${online.code}/moves/${caps.uid}`).set({name:st.players[caps.uid].name, round:st.round, family:sel.family, action:sel.action, quiz:sel.quiz, joined:online.moves[caps.uid]?.joined||Date.now()});
}
async function maybeResolve(force=false){
  const room = online.room; if(!room || room.phase!=='play') return;
  const st = room.game; if(st.over) return;
  const all = st.order.every(id=>online.moves[id] && online.moves[id].round===st.round);
  if(!all && !force) return;
  if(online.resolving===st.round) return;
  online.resolving = st.round;
  try{
    const ref = caps.db.doc('rooms/'+online.code);
    const lease = await ref.acquire({holder:caps.uid, ttlMs:8000});
    if(!lease.acquired){ online.resolving = 0; setTimeout(()=>maybeResolve(force), 9000); return; }
    const fresh = (await ref.get()).data();
    if(!fresh || fresh.phase!=='play' || fresh.game.round!==st.round) return;
    const moves = {}; st.order.forEach(id=>{ const m=online.moves[id]; if(m && m.round===st.round) moves[id]=m; });
    const game = resolveRound(fresh.game, moves);
    await ref.set({code:fresh.code, host:fresh.host, created:fresh.created, phase: game.over?'over':'play', game});
  }catch(e){ online.resolving = 0; }
}

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener('click', async e=>{
  const pop = document.getElementById('pop');
  if(pop && !pop.contains(e.target) && !e.target.closest('[data-hint]')) closePop();
  const t = e.target.closest('[data-go],[data-do],[data-open],[data-close],[data-fam],[data-act-card],[data-quiz],[data-join],[data-hint],[data-tut],[data-sec],[data-pq],[data-pfilter]');
  if(!t) return;
  if(t.dataset.pq!=null){ if(!t.disabled) practicePick(+t.dataset.pq); return; }
  if(t.dataset.pfilter){ startPractice(t.dataset.pfilter); render(); return; }
  if(t.dataset.go==='practice' && practice && practice.i>=practice.order.length) practice = null;
  if(t.dataset.sec){ const h = document.getElementById(t.dataset.sec); if(h){ h.scrollIntoView({behavior: reduced()?'auto':'smooth', block:'start'}); markSec(t.dataset.sec); } return; }
  if(t.dataset.hint){ const open = document.getElementById('pop'); if(open && open.dataset.for===t.dataset.hint){closePop();return;} openPop(t); document.getElementById('pop').dataset.for=t.dataset.hint; return; }
  if(t.hasAttribute('data-close')){ if(e.target!==t && t.classList.contains('overlay')) return; overlay=null; renderLayer(); return; }
  if(t.dataset.open){ overlay=t.dataset.open; renderLayer(); return; }
  if(t.dataset.tut){ tut={step:0,next:t.dataset.tut}; overlay='tutorial'; renderLayer(); return; }
  if(t.dataset.go){ keepNames(); if(view==='room') leaveRoom(); view=t.dataset.go; online.error=''; window.scrollTo(0,0); render(); return; }
  if(t.dataset.fam){ sel.family = t.dataset.fam; render(); return; }
  if(t.dataset.actCard){ if(t.disabled) return; const k=t.dataset.actCard, i=+t.dataset.idx; if(sel.action===k && sel.actionIdx===i){sel.action=null;sel.actionIdx=null}else{sel.action=k;sel.actionIdx=i} render(); return; }
  if(t.dataset.quiz){ sel.quiz = +t.dataset.quiz; render(); return; }
  if(t.dataset.join){ joinRoom(t.dataset.join); return; }
  const d = t.dataset.do;
  if(d==='start-local') startLocal();
  else if(d==='continue'){ if(!(local && !local.state.over)){ const s = store.get('gl-local-save', null); local = s && s.state && s.state.v===4 ? s : null; } if(local){ view='local'; render(); window.scrollTo(0,0); } }
  else if(d==='resume-local'){ const s = store.get('gl-local-save', null); local = s && s.state && s.state.v===4 ? s : null; if(local){ view='local'; render(); } }
  else if(d==='reveal-hand'){ local.curtain=false; render(); window.scrollTo(0,0); }
  else if(d==='begin-season') beginSeason();
  else if(d==='take-turn'){ online.screen='turn'; render(); window.scrollTo(0,0); }
  else if(d==='lock'){ if(!sel.family) return; showStamp('Locked in'); if(view==='local') lockLocal(); else { t.disabled=true; try{ await lockOnline(); online.screen='board'; render(); window.scrollTo(0,0); }catch(err){ t.disabled=false; } } }
  else if(d==='close-report'){
    overlay=null; render();
    const st = currentState();
    if(st && st.over && once('final|'+st.seed)){ confetti(); setTimeout(()=>document.querySelector('.final-rank')?.scrollIntoView({behavior:'smooth',block:'center'}), 200); }
    else window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(d==='create-room') createRoom();
  else if(d==='join-code') joinRoom(document.getElementById('joincode').value);
  else if(d==='start-online') startOnline();
  else if(d==='force-resolve') maybeResolve(true);
  else if(d==='toggle-hints'){ hintsOn=!hintsOn; store.set('gl-hints',hintsOn); keepNames(); render(); }
  else if(d==='open-tutorial'){ tut={step:0,next:null}; overlay='tutorial'; renderLayer(); }
  else if(d==='tut-next'){ tut.step++; renderLayer(); }
  else if(d==='tut-back'){ tut.step=Math.max(0,tut.step-1); renderLayer(); }
  else if(d==='tut-skip'){ overlay=null; if(tut.next){ view=tut.next; tut.next=null; window.scrollTo(0,0); render(); } else renderLayer(); }
  else if(d==='seasons-dec'||d==='seasons-inc'){ keepNames(); seasonsPick=Math.max(MIN_SEASONS,Math.min(MAX_SEASONS,seasonsPick+(d==='seasons-inc'?1:-1))); store.set('gl-seasons',seasonsPick); render(); }
  else if(d==='close-pop') closePop();
  else if(d==='pnext') practiceNext();
  else if(d==='prestart'){ startPractice(practice?.retry?'all':(practice?.filter||'all')); render(); window.scrollTo(0,0); }
  else if(d==='pretry'){ const P=practice; startPractice(P.filter, P.order.filter(i=>P.picks[i]!==QUIZ[i].a)); render(); window.scrollTo(0,0); }
});
document.addEventListener('keydown', e=>{
  if(view==='practice' && !overlay && !e.ctrlKey && !e.metaKey && !e.altKey && !(e.target && /INPUT|TEXTAREA/.test(e.target.tagName))){
    const P = practice;
    if(P && P.i < P.order.length){
      const qi = P.order[P.i], k = e.key.toLowerCase(), n = {a:0,b:1,c:2,'1':0,'2':1,'3':2}[k];
      if(n!=null && P.picks[qi]==null && P.perms[qi][n]!=null){ e.preventDefault(); practicePick(P.perms[qi][n]); return; }
      if((e.key==='Enter'||e.key==='ArrowRight') && P.picks[qi]!=null){ e.preventDefault(); practiceNext(); return; }
    }
  }
  if(e.key!=='Escape') return;
  if(document.getElementById('pop')){ closePop(); return; }
  if(overlay==='guide'){ overlay=null; renderLayer(); }
});
window.addEventListener('scroll', closePop, {passive:true});
document.addEventListener('scroll', closePop, {passive:true, capture:true});

render();
</script>
